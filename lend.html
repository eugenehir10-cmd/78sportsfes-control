<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>体育祭トランシーバー貸出 - 貸出</title>
    <link rel="stylesheet" href="/_next/static/chunks/5af32d58fc8f441e.css"/>
    <link rel="stylesheet" href="/_next/static/chunks/46680c00c60c31b7.css"/>
    <link rel="stylesheet" href="/_next/static/chunks/da44bdd0400cd77b.css"/>
    <style>
        .form-input { width:100%; padding:12px; font-size:1.1rem; border:1px solid #ced4da; border-radius:8px; margin-top:6px; margin-bottom:16px; box-sizing:border-box; }
        .form-label { font-weight:600; font-size:0.95rem; color:#212529; }
        .alert { padding:12px; border-radius:8px; margin-bottom:16px; display:none; font-weight:bold; }
        .alert-success { background:#d3f9d8; color:#2b8a3e; }
        .alert-error { background:#ffe3e3; color:#c92a2a; }
    </style>
</head>
<body>
    <div style="max-width:960px;margin:0 auto;padding:32px 16px;">
        <div style="margin-bottom:16px;">
            <a style="color:#495057;text-decoration:none;font-weight:bold;" href="./index.html">← トップへ戻る</a>
        </div>
        <h1 style="color:#228be6;text-align:center;margin-bottom:24px;">トランシーバー貸出</h1>
        <div id="alert-box" class="alert"></div>
        <form id="lend-form">
            <label class="form-label">トランシーバー番号</label>
            <input class="form-input" type="text" id="transceiverId" placeholder="例: 01" required autofocus />
            
            <label class="form-label">借りる人の名前・クラス</label>
            <input class="form-input" type="text" id="borrowerName" placeholder="例: 3年A組 山田太郎" required />
            
            <label class="form-label">担当・役割</label>
            <select class="form-input" id="role">
                <option value="未指定">選択してください</option>
                <option value="審判係">審判係</option>
                <option value="進行係">進行係</option>
                <option value="救護係">救護係</option>
                <option value="出発係">出発係</option>
                <option value="本部">本部</option>
                <option value="その他">その他</option>
            </select>
            
            <button id="submit-btn" style="width:100%;height:70px;background:#228be6;color:#fff;border:none;border-radius:8px;font-size:1.2rem;font-weight:bold;cursor:pointer;margin-top:12px;" type="submit">
                貸出を登録する
            </button>
        </form>
    </div>

    <script>
        const GAS_URL = localStorage.getItem('gas_url') || '';
        document.getElementById('lend-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alert = document.getElementById('alert-box');
            btn.disabled = true;
            btn.innerText = '送信中...';

            const payload = {
                action: 'lend',
                transceiverId: document.getElementById('transceiverId').value,
                borrowerName: document.getElementById('borrowerName').value,
                role: document.getElementById('role').value
            };

            try {
                if (GAS_URL) {
                    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                }
                alert.className = 'alert alert-success';
                alert.innerText = `No.${payload.transceiverId} の貸出を登録しました！`;
                alert.style.display = 'block';
                e.target.reset();
            } catch (err) {
                alert.className = 'alert alert-error';
                alert.innerText = '送信エラーが発生しました。';
                alert.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = '貸出を登録する';
            }
        });
    </script>
</body>
</html>
