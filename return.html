<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>体育祭トランシーバー貸出 - 返却</title>
    <link rel="stylesheet" href="/_next/static/chunks/5af32d58fc8f441e.css"/>
    <link rel="stylesheet" href="/_next/static/chunks/46680c00c60c31b7.css"/>
    <link rel="stylesheet" href="/_next/static/chunks/da44bdd0400cd77b.css"/>
    <style>
        .form-input { width:100%; padding:16px; font-size:1.2rem; border:1px solid #ced4da; border-radius:8px; margin-top:6px; margin-bottom:8px; box-sizing:border-box; }
        .form-label { font-weight:600; font-size:1rem; color:#212529; }
        .alert { padding:12px; border-radius:8px; margin-bottom:16px; display:none; font-weight:bold; }
        .alert-success { background:#d3f9d8; color:#2b8a3e; }
        .alert-error { background:#ffe3e3; color:#c92a2a; }
    </style>
</head>
<body>
    <div style="max-width:960px;margin:0 auto;padding:32px 16px;">
        <div style="margin-bottom:16px;">
            <a style="color:#495057;text-decoration:none;font-weight:bold;" href="./index.html">← トップへ戻る</a>
        </div>
        <h1 style="color:#be4bdb;text-align:center;margin-bottom:24px;">トランシーバー返却</h1>
        <div id="alert-box" class="alert"></div>
        <form id="return-form">
            <label class="form-label">返却するトランシーバー番号</label>
            <input class="form-input" type="text" id="transceiverId" placeholder="例: 01" required autofocus />
            <div style="font-size:0.85rem;color:#868e96;margin-bottom:24px;">※番号を入力後、「返却完了」を押してください。</div>
            
            <button id="submit-btn" style="width:100%;height:70px;background:#be4bdb;color:#fff;border:none;border-radius:8px;font-size:1.2rem;font-weight:bold;cursor:pointer;" type="submit">
                返却完了
            </button>
        </form>
    </div>

    <script>
        const GAS_URL = localStorage.getItem('gas_url') || '';
        document.getElementById('return-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alert = document.getElementById('alert-box');
            btn.disabled = true;
            btn.innerText = '処理中...';

            const payload = {
                action: 'return',
                transceiverId: document.getElementById('transceiverId').value
            };

            try {
                if (GAS_URL) {
                    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                }
                alert.className = 'alert alert-success';
                alert.innerText = `No.${payload.transceiverId} の返却を受け付けました！`;
                alert.style.display = 'block';
                e.target.reset();
            } catch (err) {
                alert.className = 'alert alert-error';
                alert.innerText = '処理エラーが発生しました。';
                alert.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = '返却完了';
            }
        });
    </script>
</body>
</html>
