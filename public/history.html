<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>入力履歴 管理｜スポーツフェスタ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- 🔥 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    body {
      background: radial-gradient(ellipse at top, rgba(255,255,255,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(255,255,255,0.03) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a0a 0%, #141414 50%, #0a0a0a 100%);
      min-height: 100vh;
    }
    .card {
      background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(20,20,20,0.95));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 120px rgba(255,255,255,0.02), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .history-card {
      background: linear-gradient(145deg, rgba(40,40,40,0.7), rgba(25,25,25,0.9));
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.3s ease;
    }
    .history-card:hover { border-color: rgba(255,255,255,0.15); }
    .page-ball { background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(37,99,235,0.05)); border-left: 4px solid #3b82f6; }
    .page-team { background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.08)); border-left: 4px solid #10b981; }
    .glow-text { text-shadow: 0 0 40px rgba(255,255,255,0.12), 0 0 80px rgba(255,255,255,0.05); }
    .divider { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); height: 1px; }
    input, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; font-size: 16px !important; }
    select option { background: #1a1a1a; color: white; }
    .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .rank-badge { font-size: 11px; padding: 2px 8px; border-radius: 9999px; }
    .scroll-y { max-height: 70vh; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .scroll-y::-webkit-scrollbar { width: 8px; }
    .scroll-y::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .device-badge { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); }
    .changes-diff { background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1); }
    .empty-state { padding: 60px 20px; text-align: center; }
    .sync-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 9999px; }
    .sync-online { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .sync-offline { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .sync-syncing { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse-dot { animation: pulse-soft 1.2s ease-in-out infinite; }
  </style>
</head>
<body class="text-white max-w-4xl mx-auto px-4 py-10 md:py-14">
  <header class="mb-10 fade-in-up">
    <a href="timetable.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors mb-4">
      <i data-lucide="arrow-left" class="w-4 h-4"></i><span>進行管理に戻る</span>
    </a>
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div>
        <p class="text-gray-500 text-xs tracking-[0.25em] uppercase mb-2">Input History</p>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight glow-text flex items-center gap-3">
          <i data-lucide="history" class="w-8 h-8 md:w-10 md:h-10 text-amber-400"></i>📋 入力履歴 管理
        </h1>
        <p class="text-gray-400 mt-3 text-sm">点数・順位・ステータスの入力履歴を閲覧</p>
      </div>
      <div class="flex gap-2 items-center">
        <span id="syncStatus" class="sync-status sync-syncing">
          <span class="w-2 h-2 rounded-full bg-current pulse-dot"></span>
          <span id="syncStatusText">接続中...</span>
        </span>
        <button id="manualSyncBtn" class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/15 transition-colors text-sm flex items-center gap-1.5">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i><span class="hidden sm:inline">同期</span>
        </button>
        <button id="exportCsvBtn" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/15 transition-colors text-sm flex items-center gap-2">
          <i data-lucide="file-text" class="w-4 h-4"></i><span class="hidden sm:inline">CSV</span>
        </button>
        <button id="clearBtn" class="px-4 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors text-sm flex items-center gap-2">
          <i data-lucide="trash-2" class="w-4 h-4"></i><span class="hidden sm:inline">削除</span>
        </button>
      </div>
    </div>
    <div class="divider w-full mt-6 rounded-full"></div>
  </header>

  <!-- サマリー -->
  <div class="card rounded-3xl p-6 mb-8 fade-in-up delay-1">
    <div class="grid gap-4 md:grid-cols-4">
      <div class="bg-white/5 rounded-2xl p-4 border border-white/5">
        <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">総履歴数</p>
        <p id="totalCount" class="text-2xl font-bold font-mono-num">0</p>
      </div>
      <div class="bg-blue-500/10 rounded-2xl p-4 border border-blue-500/20">
        <p class="text-xs text-blue-400 uppercase tracking-wider mb-1">球技日</p>
        <p id="ballCount" class="text-2xl font-bold font-mono-num text-blue-400">0</p>
      </div>
      <div class="bg-emerald-500/10 rounded-2xl p-4 border border-emerald-500/20">
        <p class="text-xs text-emerald-400 uppercase tracking-wider mb-1">団体競技日</p>
        <p id="teamCount" class="text-2xl font-bold font-mono-num text-emerald-400">0</p>
      </div>
      <div class="bg-amber-500/10 rounded-2xl p-4 border border-amber-500/20">
        <p class="text-xs text-amber-400 uppercase tracking-wider mb-1">最新更新</p>
        <p id="latestTime" class="text-sm font-medium">-</p>
      </div>
    </div>
  </div>

  <!-- フィルター -->
  <div class="card rounded-2xl p-4 mb-6 fade-in-up delay-1 flex flex-wrap gap-3 items-center">
    <span class="text-sm text-gray-400">絞り込み：</span>
    <select id="filterPage" class="rounded-lg px-3 py-2 text-sm bg-white/5 border border-white/10">
      <option value="all">全ページ</option>
      <option value="ball">⚽ 球技日</option>
      <option value="team">🏃 団体競技日</option>
    </select>
    <select id="filterType" class="rounded-lg px-3 py-2 text-sm bg-white/5 border border-white/10">
      <option value="all">全種別</option>
      <option value="result">順位入力</option>
      <option value="status">ステータス変更</option>
      <option value="delay">時間調整</option>
    </select>
    <input type="search" id="searchInput" placeholder="検索（種目名・端末など）" class="flex-1 min-w-[200px] rounded-lg px-3 py-2 text-sm bg-white/5 border border-white/10">
  </div>

  <!-- 履歴一覧 -->
  <div class="fade-in-up delay-2">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold flex items-center gap-2">
        <i data-lucide="list" class="w-5 h-5 text-gray-400"></i>履歴一覧
      </h2>
      <span id="filteredCount" class="text-sm text-gray-500">0件</span>
    </div>
    <div id="historyList" class="space-y-3 scroll-y"></div>
  </div>

  <script>
    lucide.createIcons();

    // 🔥 Firebase初期化
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAwVUxoXbvTraGUDoLztqqcJx2fIHqUntc",
      authDomain: "thsportsfes.firebaseapp.com",
      databaseURL: "https://thsportsfes-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "thsportsfes",
      storageBucket: "thsportsfes.firebasestorage.app",
      messagingSenderId: "96596815858",
      appId: "1:96596815858:web:5f85526bf785ccc5d8056b",
      measurementId: "G-TCPMRTY3P1"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    const Sync = {
      setStatus(s, text) {
        const el = document.getElementById('syncStatus');
        const txt = document.getElementById('syncStatusText');
        if (!el) return;
        el.className = `sync-status sync-${s}`;
        if (txt) txt.textContent = text;
      },
      async mergeHistoryFromFirestore() {
        try {
          this.setStatus('syncing', '履歴同期中...');
          const snap = await db.collection('input_history').orderBy('timestamp', 'desc').limit(500).get();
          const remote = [];
          snap.forEach(doc => {
            const d = doc.data();
            remote.push({
              ...d,
              timestamp: d.timestamp?.toDate?.().toISOString() || d.timestamp || new Date().toISOString(),
              _id: doc.id
            });
          });
          const local = JSON.parse(localStorage.getItem('input_history_v4') || '[]');
          // マージ：重複排除（タイムスタンプ+種目名+ページで判定）
          const merged = [...local];
          const keys = new Set(local.map(h => `${h.timestamp}-${h.eventName||h.matchName}-${h.page}`));
          remote.forEach(r => {
            const key = `${r.timestamp}-${r.eventName||r.matchName}-${r.page}`;
            if (!keys.has(key)) { merged.push(r); keys.add(key); }
          });
          merged.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          const trimmed = merged.slice(0, 500);
          localStorage.setItem('input_history_v4', JSON.stringify(trimmed));
          this.setStatus('online', 'オンライン');
          return trimmed;
        } catch (e) {
          console.warn('Firestore履歴読込失敗:', e);
          this.setStatus('offline', 'オフライン');
          return JSON.parse(localStorage.getItem('input_history_v4') || '[]');
        }
      },
      subscribeHistory(callback) {
        return db.collection('input_history').orderBy('timestamp', 'desc').limit(100).onSnapshot(async () => {
          const hist = await this.mergeHistoryFromFirestore();
          callback(hist);
        }, err => {
          console.warn('履歴同期エラー:', err);
          this.setStatus('offline', 'オフライン');
        });
      }
    };

    let historyData = [];

    function formatDate(iso) {
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function formatTimeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'たった今';
      if (m < 60) return `${m}分前`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}時間前`;
      const d = Math.floor(h / 24);
      return `${d}日前`;
    }

    function renderSummary(hist) {
      document.getElementById('totalCount').textContent = hist.length;
      document.getElementById('ballCount').textContent = hist.filter(h => h.page === 'ball').length;
      document.getElementById('teamCount').textContent = hist.filter(h => h.page === 'team').length;
      document.getElementById('latestTime').textContent = hist.length ? formatTimeAgo(hist[0].timestamp) : '-';
    }

    function renderHistory() {
      const hist = historyData;
      renderSummary(hist);

      const fPage = document.getElementById('filterPage').value;
      const fType = document.getElementById('filterType').value;
      const search = document.getElementById('searchInput').value.toLowerCase();

      let filtered = hist;
      if (fPage !== 'all') filtered = filtered.filter(h => h.page === fPage);
      if (fType !== 'all') filtered = filtered.filter(h => h.type === fType);
      if (search) filtered = filtered.filter(h => {
        const text = `${h.eventName || ''} ${h.matchName || ''} ${h.grade || ''} ${h.venue || ''} ${h.device || ''}`.toLowerCase();
        return text.includes(search);
      });

      document.getElementById('filteredCount').textContent = `${filtered.length}件`;

      const listEl = document.getElementById('historyList');
      if (!filtered.length) {
        listEl.innerHTML = `
          <div class="empty-state card rounded-2xl">
            <i data-lucide="inbox" class="w-16 h-16 mx-auto text-gray-600 mb-4"></i>
            <p class="text-gray-400 text-lg mb-2">履歴がありません</p>
            <p class="text-gray-500 text-sm">球技日・団体競技日で順位やステータスを入力すると、ここに記録されます</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      listEl.innerHTML = filtered.map(h => {
        const pageClass = h.page === 'ball' ? 'page-ball' : 'page-team';
        const pageLabel = h.page === 'ball' ? '⚽ 球技日' : '🏃 団体競技日';
        const name = h.eventName || h.matchName || '-';
        const grade = h.grade ? `<span class="text-xs px-2 py-0.5 rounded-full bg-white/10">${h.grade}</span>` : '';
        const venue = h.venue ? `<span class="text-xs px-2 py-0.5 rounded-full bg-white/10">${h.venue}</span>` : '';

        const changes = [];
        if (h.after) {
          ['rank1', 'rank2', 'rank3', 'rank4'].forEach(r => {
            if (h.after[r] && h.before?.[r] !== h.after[r]) {
              const medal = { rank1: '🥇', rank2: '🥈', rank3: '🥉', rank4: '4' }[r];
              changes.push(`<span class="rank-badge bg-amber-400/15 text-amber-300">${medal}${h.after[r]}組</span>`);
            }
          });
          if (h.after.status && h.before?.status !== h.after.status) {
            const smap = { wait: '未開始', ready: '準備中', running: '進行中', delay: '遅延', early: '早まり', done: '終了', future: 'まもなく', pending: '準備中' };
            changes.push(`<span class="rank-badge bg-emerald-400/15 text-emerald-300">ステ: ${smap[h.after.status] || h.after.status}</span>`);
          }
          if (h.after.delay !== undefined && h.before?.delay != h.after.delay) {
            const d = h.after.delay;
            const color = d > 0 ? 'text-amber-300 bg-amber-400/15' : d < 0 ? 'text-cyan-300 bg-cyan-400/15' : 'text-gray-300 bg-gray-400/15';
            changes.push(`<span class="rank-badge ${color}">⏱${d >= 0 ? '+' : ''}${d}分</span>`);
          }
        }

        return `
          <div class="history-card ${pageClass} rounded-2xl p-4">
            <div class="flex justify-between items-start mb-3 flex-wrap gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-white/10">${pageLabel}</span>
                <span class="font-semibold">${name}</span>
                ${grade}${venue}
              </div>
              <div class="text-right">
                <p class="font-mono-num text-sm text-white">${formatDate(h.timestamp)}</p>
                <p class="text-xs text-gray-500">${formatTimeAgo(h.timestamp)}</p>
              </div>
            </div>
            ${changes.length ? `
              <div class="changes-diff rounded-xl p-3 mb-3">
                <p class="text-xs text-gray-500 mb-2">📝 変更内容</p>
                <div class="flex flex-wrap gap-2">${changes.join('')}</div>
              </div>
            ` : ''}
            <div class="flex items-center gap-2 flex-wrap pt-2 border-t border-white/5">
              <div class="device-badge rounded-lg px-3 py-1.5 text-xs text-gray-400 flex items-center gap-1.5 flex-1 min-w-0">
                <i data-lucide="smartphone" class="w-3.5 h-3.5 flex-shrink-0"></i>
                <span class="truncate">${h.device || 'Unknown'}</span>
              </div>
              <button class="show-ua-btn text-xs text-gray-500 hover:text-gray-300 px-2 py-1 rounded hover:bg-white/5 transition-colors" data-ua="${encodeURIComponent(h.userAgent || '')}">
                UA詳細
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
      bindUaButtons();
    }

    function bindUaButtons() {
      document.querySelectorAll('.show-ua-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const ua = decodeURIComponent(btn.dataset.ua);
          alert(`User Agent:\n\n${ua}`);
        });
      });
    }

    document.getElementById('filterPage').addEventListener('change', renderHistory);
    document.getElementById('filterType').addEventListener('change', renderHistory);
    document.getElementById('searchInput').addEventListener('input', renderHistory);

    document.getElementById('manualSyncBtn').addEventListener('click', async () => {
      historyData = await Sync.mergeHistoryFromFirestore();
      renderHistory();
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (!confirm('入力履歴を全て削除しますか？\nFirebase側も削除されます。\nこの操作は取り消せません。')) return;
      localStorage.removeItem('input_history_v4');
      try {
        Sync.setStatus('syncing', '削除中...');
        const snap = await db.collection('input_history').limit(500).get();
        const batch = db.batch();
        snap.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        Sync.setStatus('online', 'オンライン');
      } catch (e) { console.warn(e); }
      historyData = [];
      renderHistory();
      alert('削除しました');
    });

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const hist = historyData;
      if (!hist.length) { alert('履歴がありません'); return; }
      const header = ['日時', 'ページ', '種別', '種目名', '学年', '会場', '1位', '2位', '3位', '4位', 'ステータス', '遅延', '端末', 'UserAgent'];
      const rows = hist.map(h => [
        formatDate(h.timestamp),
        h.page === 'ball' ? '球技日' : '団体競技日',
        h.type || '',
        h.eventName || h.matchName || '',
        h.grade || '',
        h.venue || '',
        h.after?.rank1 || '', h.after?.rank2 || '', h.after?.rank3 || '', h.after?.rank4 || '',
        h.after?.status || '',
        h.after?.delay ?? '',
        h.device || '',
        (h.userAgent || '').replace(/"/g, '""')
      ]);
      const csv = '\uFEFF' + [header, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `input_history_${new Date().toISOString().slice(0,10)}.csv`;
      a.click(); URL.revokeObjectURL(url);
    });

    // 🔥 初期化 + リアルタイム同期
    async function init() {
      Sync.setStatus('syncing', '接続中...');
      historyData = await Sync.mergeHistoryFromFirestore();
      renderHistory();
      Sync.subscribeHistory(hist => {
        historyData = hist;
        renderHistory();
      });
    }
    init();
  </script>
</body>
</html>
