<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>備品貸出管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --main: #2563eb; --ok: #10b981; --warn: #f59e0b; --danger: #ef4444;
      --dark: #1f2937; --light: #f3f4f6; --shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    *{box-sizing:border-box; margin:0; padding:0; font-family:system-ui, sans-serif;}
    body{background:#f8fafc; color:var(--dark); max-w-3xl; margin:0 auto; padding:1rem;}
    a{text-decoration:none; color:var(--main);}
    .card{background:#fff; border-radius:12px; padding:1rem; margin-bottom:1rem; box-shadow:var(--shadow);}
    .btn{border:none; border-radius:8px; padding:.6rem 1rem; font-weight:bold; cursor:pointer; transition:.2s;}
    .btn:hover{transform:translateY(-1px);}
    .btn.primary{background:var(--main); color:#fff;}
    .btn.danger{background:var(--danger); color:#fff;}
    .btn.small{padding:.4rem .7rem; font-size:.85rem;}
    .btn.ghost{background:transparent; border:1px solid #ddd;}
    input, select, textarea{border:1px solid #ddd; border-radius:8px; padding:.6rem; font-size:16px; width:100%; margin-bottom:.5rem;}
    label{font-weight:500; font-size:.9rem; display:block; margin-bottom:.3rem;}
    .badge{display:inline-block; border-radius:999px; padding:.2rem .5rem; font-size:.75rem; font-weight:bold;}
    .avail{background:#dcfce7; color:#065f46;}
    .lend{background:#fef3c7; color:#92400e;}
    .popup{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:12px; padding:1.5rem; box-shadow:0 10px 30px rgba(0,0,0,.2); z-index:100; max-width:90%; width:360px; display:none;}
    .overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:99; display:none;}
    .page{display:none;}
    .page.active{display:block;}
    table{width:100%; border-collapse:collapse; font-size:.9rem;}
    th, td{border-bottom:1px solid #eee; padding:.6rem .4rem; text-align:left;}
    th{background:#f8fafc; font-weight:bold;}
    .del-btn{color:var(--danger); cursor:pointer; font-weight:bold;}
    .del-btn:hover{opacity:.7;}
    .detail-text{font-size:.75rem; color:#6b7280; margin-top:.15rem;}
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header class="mb-4">
    <a href="index.html" class="inline-flex items-center gap-2 text-lg font-bold mb-3 block">← ホームに戻る</a>
    <h1 class="text-2xl font-bold">📻 備品貸出管理</h1>
  </header>

  <!-- ページ切替 -->
  <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
    <button data-page="pageList" class="btn ghost small page-tab active">一覧</button>
    <button data-page="pageLend" class="btn ghost small page-tab">貸出/返却</button>
    <button data-page="pageHistory" class="btn ghost small page-tab">履歴</button>
    <button data-page="pageSettings" class="btn ghost small page-tab">設定</button>
  </div>

  <!-- ========== 一覧ページ ========== -->
  <section id="pageList" class="page active">
    <div id="categoryTabs" class="flex gap-2 mb-4 overflow-x-auto pb-1"></div>
    <div class="card">
      <h3 class="font-bold mb-3" id="currentCatTitle">備品一覧</h3>
      <div id="itemList"></div>
    </div>
  </section>

  <!-- ========== 貸出/返却ページ ========== -->
  <section id="pageLend" class="page">
    <div class="card mb-4">
      <h3 class="font-bold mb-3">📤 一括貸出</h3>
      <label>利用者名</label>
      <select id="lendUserSelect"><option value="">選択してください</option></select>
      <label>品目種別</label>
      <select id="lendCatSelect"><option value="">選択してください</option></select>
      <label>台数</label>
      <input type="number" id="lendCount" min="1" value="1" placeholder="台数を入力">
      <label>備考</label>
      <textarea id="lendNote" rows="2" placeholder="任意"></textarea>
      <button id="lendBtn" class="btn primary w-full">貸出実行</button>
    </div>

    <div class="card">
      <h3 class="font-bold mb-3">📥 一括返却</h3>
      <label>利用者で絞込</label>
      <select id="returnUserSelect"><option value="">全て</option></select>
      <div id="returnListArea" class="mt-3"></div>
      <div id="batteryRow" class="mt-2 hidden">
        <label>🔋 シーバー電池残量</label>
        <select id="batteryLevel">
          <option value="">選択してください</option>
          <option value="3">十分</option>
          <option value="2">中程度</option>
          <option value="1">残りわずか</option>
        </select>
      </div>
      <label class="mt-3 block">返却備考</label>
      <textarea id="returnNote" rows="2" placeholder="任意"></textarea>
      <button id="returnBtn" class="btn primary w-full mt-3">選択分を一括返却</button>
    </div>
  </section>

  <!-- ========== 履歴ページ ========== -->
  <section id="pageHistory" class="page">
    <div class="card">
      <h3 class="font-bold mb-3">📋 貸出返却履歴</h3>
      <div id="historyList" class="text-sm space-y-2"></div>
    </div>
  </section>

  <!-- ========== 設定ページ ========== -->
  <section id="pageSettings" class="page">
    <div class="card mb-4">
      <h3 class="font-bold mb-3">📦 品目種別</h3>
      <input type="text" id="newCatInput" placeholder="種別名">
      <button id="addCatBtn" class="btn primary w-full mb-3">種別追加</button>
      <ul id="catManageList" class="space-y-2 text-sm"></ul>
    </div>

    <div class="card mb-4">
      <h3 class="font-bold mb-3">🏷️ 備品登録・編集</h3>
      <label>種別</label>
      <select id="editItemCat"><option value="">選択してください</option></select>
      <label>管理番号 / ラベル</label>
      <input type="text" id="editItemLabel" placeholder="例：A-001">
      <label>詳細ラベル・備考</label>
      <input type="text" id="editItemDetail" placeholder="例：予備・倉庫・バッテリー強化">
      <button id="saveItemBtn" class="btn primary w-full">保存</button>
      <p class="text-xs text-gray-400 mt-2">編集する場合は下から選択</p>
      <select id="editItemSelect" class="mt-2">
        <option value="">→ 編集/削除する備品を選択</option>
      </select>
      <button id="deleteItemBtn" class="btn danger small w-full mt-2 hidden">この備品を完全削除</button>
    </div>

    <div class="card">
      <h3 class="font-bold mb-3">👤 利用者管理</h3>
      <input type="text" id="newUserInput" placeholder="利用者名">
      <button id="addUserBtn" class="btn primary w-full mb-3">追加</button>
      <ul id="userManageList" class="space-y-2 text-sm"></ul>
    </div>
  </section>

  <!-- ポップアップ -->
  <div class="overlay" id="overlay"></div>
  <div class="popup" id="popup">
    <p id="popupText" class="mb-4 whitespace-pre-line"></p>
    <button id="popupClose" class="btn primary w-full">OK</button>
  </div>

  <script>
    // ===== データ定義 =====
    let categories = ['トランシーバー', 'シーバー', 'その他備品'];
    let users = [];
    let items = [];
    let history = [];
    let currentCategory = categories[0] || '';
    let editingItemId = null;

    // ===== 保存/読込 =====
    function saveAll() {
      localStorage.setItem('lend_categories', JSON.stringify(categories));
      localStorage.setItem('lend_users', JSON.stringify(users));
      localStorage.setItem('lend_items', JSON.stringify(items));
      localStorage.setItem('lend_history', JSON.stringify(history));
    }
    function loadAll() {
      categories = JSON.parse(localStorage.getItem('lend_categories') || '["トランシーバー","シーバー","その他備品"]');
      users = JSON.parse(localStorage.getItem('lend_users') || '[]');
      items = JSON.parse(localStorage.getItem('lend_items') || '[]');
      history = JSON.parse(localStorage.getItem('lend_history') || '[]');
      if (!currentCategory || !categories.includes(currentCategory)) {
        currentCategory = categories[0] || '';
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
    function getNowTime() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    function showPopup(text) {
      document.getElementById('popupText').textContent = text;
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('popup').style.display = 'block';
    }
    function closePopup() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('popup').style.display = 'none';
    }

    // ===== 描画 =====
    function renderCategoryTabs() {
      const cont = document.getElementById('categoryTabs');
      cont.innerHTML = categories.map(cat => `
        <button class="btn small ${cat === currentCategory ? 'primary' : 'ghost'}" data-cat="${cat}">${cat}</button>
      `).join('');
      cont.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          currentCategory = b.dataset.cat;
          renderAllCurrent();
        });
      });
      document.getElementById('currentCatTitle').textContent = currentCategory || '備品一覧';
    }

    function renderItemList() {
      const cont = document.getElementById('itemList');
      const filtered = items.filter(i => i.category === currentCategory);
      if (!filtered.length) {
        cont.innerHTML = '<p class="text-gray-400 text-sm">登録なし</p>';
        return;
      }
      cont.innerHTML = `
        <table>
          <thead><tr><th>管理番号</th><th>状態</th><th>利用者</th><th>詳細ラベル</th></tr></thead>
          <tbody>
            ${filtered.map(item => {
              const stClass = item.status === 'available' ? 'avail' : 'lend';
              const stText = item.status === 'available' ? '在庫' : `貸出中\n${item.borrower || ''}`;
              return `<tr>
                <td><strong>${item.label || '未設定'}</strong></td>
                <td><span class="badge ${stClass}">${stText}</span></td>
                <td>${item.borrower || '-'}</td>
                <td class="detail-text">${item.detail || '-'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    function renderSelects() {
      const catOpts = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      const userOpts = users.map(u => `<option value="${u}">${u}</option>`).join('');
      document.getElementById('lendCatSelect').innerHTML = '<option value="">選択してください</option>' + catOpts;
      document.getElementById('lendUserSelect').innerHTML = '<option value="">選択してください</option>' + userOpts;
      document.getElementById('returnUserSelect').innerHTML = '<option value="">全て</option>' + userOpts;
      document.getElementById('editItemCat').innerHTML = '<option value="">選択してください</option>' + catOpts;
      document.getElementById('editItemSelect').innerHTML =
        '<option value="">→ 編集/削除する備品を選択</option>' +
        items.map(i => `<option value="${i.id}">${i.category}｜${i.label || '番号なし'}${i.detail?`｜${i.detail}`:''}</option>`).join('');
    }

    function renderReturnList() {
      const selectedUser = document.getElementById('returnUserSelect').value;
      const lent = items.filter(i => i.status === 'lent' && (!selectedUser || i.borrower === selectedUser));
      const area = document.getElementById('returnListArea');
      if (!lent.length) {
        area.innerHTML = '<p class="text-gray-400 text-sm">貸出中なし</p>';
        document.getElementById('batteryRow').classList.add('hidden');
        return;
      }
      area.innerHTML = lent.map(item => `
        <label class="flex items-center gap-3 py-2 border-b">
          <input type="checkbox" class="return-check" value="${item.id}" data-cat="${item.category}">
          <div>
            <p class="font-medium">${item.label || '番号なし'}</p>
            <p class="detail-text">${item.category} / ${item.borrower}${item.detail?` / ${item.detail}`:''}</p>
          </div>
        </label>
      `).join('');
      const checks = area.querySelectorAll('.return-check');
      function toggleBattery() {
        const hasSeaver = Array.from(checks).some(c => c.checked && c.dataset.cat === 'シーバー');
        document.getElementById('batteryRow').classList.toggle('hidden', !hasSeaver);
      }
      checks.forEach(c => c.addEventListener('change', toggleBattery));
      toggleBattery();
    }

    function renderSettingsLists() {
      document.getElementById('catManageList').innerHTML = categories.map(cat => {
        const using = items.filter(i => i.category === cat).length;
        return `<li class="flex justify-between items-center py-2 border-b">
          <span>${cat}</span>
          <span class="text-xs text-gray-400">${using}件 使用中</span>
          ${using===0?`<button class="del-btn" data-del-cat="${cat}">削除</button>`:'<span class="text-xs text-gray-300">削除不可</span>'}
        </li>`;
      }).join('');
      document.getElementById('userManageList').innerHTML = users.map(u => {
        const using = items.filter(i => i.borrower === u).length;
        return `<li class="flex justify-between items-center py-2 border-b">
          <span>${u}</span>
          <span class="text-xs text-gray-400">${using}件 貸出中</span>
          ${using===0?`<button class="del-btn" data-del-user="${u}">削除</button>`:'<span class="text-xs text-gray-300">削除不可</span>'}
        </li>`;
      }).join('');
    }

    function renderHistory() {
      const cont = document.getElementById('historyList');
      if (!history.length) { cont.innerHTML = '<p class="text-gray-400">履歴なし</p>'; return; }
      cont.innerHTML = history.slice().reverse().map(h => `
        <div class="py-2 border-b">
          <p class="text-xs text-gray-400">${h.timestamp}</p>
          <p class="font-bold">${h.action==='lend'?'📤 貸出':'📥 返却'}</p>
          <p>${h.items.join(', ')}</p>
          <p class="text-sm">利用者：${h.user}</p>
          ${h.note?`<p class="detail-text">備考：${h.note}</p>`:''}
          ${h.battery?`<p class="text-xs text-green-600">🔋 電池：${{3:'十分',2:'中程度',1:'残りわずか'}[h.battery]}</p>`:''}
        </div>
      `).join('');
    }

    function renderAllCurrent() {
      renderCategoryTabs();
      renderItemList();
      renderSelects();
      renderReturnList();
      renderSettingsLists();
      renderHistory();
    }

    // ===== ページ切替 =====
    document.querySelectorAll('.page-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(tab.dataset.page).classList.add('active');
        if (tab.dataset.page === 'pageLend') renderReturnList();
      });
    });

    // ===== 貸出 =====
    document.getElementById('lendBtn').addEventListener('click', () => {
      const cat = document.getElementById('lendCatSelect').value;
      const user = document.getElementById('lendUserSelect').value;
      const count = parseInt(document.getElementById('lendCount').value) || 0;
      const note = document.getElementById('lendNote').value.trim();
      if (!cat || !user || count < 1) return alert('必須項目を入力');
      const avail = items.filter(i => i.category === cat && i.status === 'available');
      if (avail.length < count) return alert(`在庫不足：利用可能${avail.length}台 / 要求${count}台`);
      const targets = avail.slice(0, count);
      const labels = targets.map(t => t.label || '番号なし');
      targets.forEach(t => { t.status = 'lent'; t.borrower = user; t.lentAt = getNowTime(); });
      history.push({ timestamp: getNowTime(), action: 'lend', user, items: labels, note });
      saveAll();
      showPopup(`✅ ${user} へ ${cat} ${count}台 貸出\n${labels.join(', ')}`);
      document.getElementById('lendNote').value = '';
      renderAllCurrent();
    });

    // ===== 返却 =====
    document.getElementById('returnBtn').addEventListener('click', () => {
      const ids = Array.from(document.querySelectorAll('.return-check:checked')).map(c => c.value);
      if (!ids.length) return alert('返却する備品を選択');
      const note = document.getElementById('returnNote').value.trim();
      const battery = document.getElementById('batteryLevel').value;
      const returning = items.filter(i => ids.includes(i.id));
      const usersSet = [...new Set(returning.map(i => i.borrower))];
      if (usersSet.length > 1) return alert('同一利用者のみ一括返却可');
      returning.forEach(t => {
        t.status = 'available'; t.borrower = ''; t.lentAt = null;
        if (battery) t.lastBattery = battery;
      });
      history.push({
        timestamp: getNowTime(), action: 'return', user: usersSet[0],
        items: returning.map(t => t.label || '番号なし'), note, battery: battery||null
      });
      saveAll();
      showPopup(`✅ ${returning.length}台 返却完了`);
      document.getElementById('returnNote').value = '';
      document.getElementById('batteryLevel').value = '';
      renderAllCurrent();
    });

    // ===== 種別追加 =====
    document.getElementById('addCatBtn').addEventListener('click', () => {
      const name = document.getElementById('newCatInput').value.trim();
      if (!name || categories.includes(name)) return alert('空または既存');
      categories.push(name); currentCategory = name; saveAll(); renderAllCurrent();
      document.getElementById('newCatInput').value = '';
    });

    // ===== 利用者追加 =====
    document.getElementById('addUserBtn').addEventListener('click', () => {
      const name = document.getElementById('newUserInput').value.trim();
      if (!name || users.includes(name)) return alert('空または既存');
      users.push(name); saveAll(); renderAllCurrent();
      document.getElementById('newUserInput').value = '';
    });

    // ===== 備品保存 =====
    document.getElementById('saveItemBtn').addEventListener('click', () => {
      const cat = document.getElementById('editItemCat').value;
      const label = document.getElementById('editItemLabel').value.trim();
      const detail = document.getElementById('editItemDetail').value.trim();
      if (!cat || !label) return alert('種別・管理番号は必須');

      if (editingItemId) {
        const item = items.find(i => i.id === editingItemId);
        if (!item) return;
        item.category = cat;
        item.label = label;
        item.detail = detail;
        showPopup(`✅ 更新：${label}`);
      } else {
        items.push({
          id: generateId(), category: cat, label, detail,
          status: 'available', borrower: '', lentAt: null
        });
        showPopup(`✅ 登録：${label}`);
      }
      saveAll(); resetEditForm(); renderAllCurrent();
    });

    // 編集フォームリセット
    function resetEditForm() {
      editingItemId = null;
      document.getElementById('deleteItemBtn').classList.add('hidden');
      document.getElementById('editItemSelect').value = '';
      document.getElementById('editItemCat').value = '';
      document.getElementById('editItemLabel').value = '';
      document.getElementById('editItemDetail').value = '';
    }

    // 編集対象選択
    document.getElementById('editItemSelect').addEventListener('change', e => {
      const id = e.target.value;
      if (!id) { resetEditForm(); return; }
      const item = items.find(i => i.id === id);
      if (!item) return;
      editingItemId = id;
      document.getElementById('editItemCat').value = item.category;
      document.getElementById('editItemLabel').value = item.label;
      document.getElementById('editItemDetail').value = item.detail || '';
      document.getElementById('deleteItemBtn').classList.remove('hidden');
    });

    // ===== 備品 完全削除 ← 修正箇所 =====
    document.getElementById('deleteItemBtn').addEventListener('click', () => {
      if (!editingItemId) return;
      const item = items.find(i => i.id === editingItemId);
      if (!item) return;
      if (item.status === 'lent') return alert('貸出中のため削除不可。先に返却してください。');

      if (!confirm(
        `⚠️ 備品を完全削除します\n` +
        `管理番号：${item.label}\n` +
        `詳細：${item.detail || 'なし'}\n\n` +
        `この備品のデータは完全に消去され、` +
        `他の備品に引き継がれることはありません。\n` +
        `よろしいですか？`
      )) return;

      // ✅ 完全削除：この備品のデータのみを抹消、他に影響なし
      items = items.filter(i => i.id !== editingItemId);

      saveAll();
      showPopup(`✅ 完全削除しました\n番号：${item.label}\n詳細：${item.detail || 'なし'}`);
      resetEditForm();
      renderAllCurrent();
    });

    // 種別/利用者削除
    document.addEventListener('click', e => {
      const delCat = e.target.getAttribute('data-del-cat');
      if (delCat && !e.target.classList.contains('text-gray-300')) {
        if (!confirm(`「${delCat}」削除しますか？`)) return;
        categories = categories.filter(c => c !== delCat);
        if (currentCategory === delCat) currentCategory = categories[0] || '';
        saveAll(); renderAllCurrent(); return;
      }
      const delUser = e.target.getAttribute('data-del-user');
      if (delUser && !e.target.classList.contains('text-gray-300')) {
        if (!confirm(`「${delUser}」削除しますか？`)) return;
        users = users.filter(u => u !== delUser);
        saveAll(); renderAllCurrent();
      }
    });

    document.getElementById('popupClose').addEventListener('click', closePopup);
    document.getElementById('overlay').addEventListener('click', closePopup);

    loadAll(); renderAllCurrent();
  </script>
</body>
</html>
