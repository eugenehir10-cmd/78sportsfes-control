<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>備品貸出管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    .sync-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .sync-online { background: #22c55e; }
    .sync-offline { background: #ef4444; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .check-item { transition: background 0.2s; padding: 10px 8px; cursor: pointer; }
    .check-item:hover, .check-item:active { background: #f3f4f6; }
    .tab-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tab-scroll::-webkit-scrollbar { display: none; }
    table { width: 100%; min-width: 640px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    input, select, textarea, button { font-size: 16px !important; }
    @media (max-width: 640px) {
      h1 { font-size: 1.25rem !important; }
      h2 { font-size: 1.1rem !important; }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 max-w-5xl mx-auto p-3 md:p-6 pb-8">
  <header class="mb-4 mt-2">
    <div class="flex justify-between items-center mb-3 gap-2">
      <h1 class="text-xl font-bold">📻 備品貸出管理</h1>
      <span class="text-xs text-gray-500 flex items-center gap-1 whitespace-nowrap">
        <span id="syncDot" class="sync-dot sync-offline"></span>
        <span id="syncText">接続中…</span>
      </span>
    </div>
    <nav class="tab-scroll mb-4">
      <div class="flex gap-2 pb-1 min-w-max">
        <button data-tab="lend" class="tab-btn px-3 py-2.5 rounded-lg bg-blue-500 text-white text-sm font-medium whitespace-nowrap">台数指定貸出</button>
        <button data-tab="return" class="tab-btn px-3 py-2.5 rounded-lg bg-gray-200 text-sm font-medium whitespace-nowrap">利用者別返却</button>
        <button data-tab="list" class="tab-btn px-3 py-2.5 rounded-lg bg-gray-200 text-sm font-medium whitespace-nowrap">一覧</button>
        <button data-tab="history" class="tab-btn px-3 py-2.5 rounded-lg bg-gray-200 text-sm font-medium whitespace-nowrap">履歴</button>
        <button data-tab="settings" class="tab-btn px-3 py-2.5 rounded-lg bg-gray-200 text-sm font-medium whitespace-nowrap">設定</button>
      </div>
    </nav>
  </header>

  <!-- ===== 台数指定貸出 ===== -->
  <section id="lend" class="tab-content active">
    <h2 class="text-lg font-semibold mb-3">📤 台数指定貸出</h2>
    <form id="lendForm" class="space-y-3 bg-white p-4 rounded-lg shadow">
      <div>
        <label class="block mb-1.5 text-sm font-medium">品目種別</label>
        <select id="lendCategory" class="w-full border rounded-lg px-3 py-2.5" required>
          <option value="">選択してください</option>
        </select>
      </div>
      <div>
        <label class="block mb-1.5 text-sm font-medium">利用者名</label>
        <select id="lendUser" class="w-full border rounded-lg px-3 py-2.5" required>
          <option value="">選択してください</option>
        </select>
      </div>
      <div>
        <label class="block mb-1.5 text-sm font-medium">貸出台数</label>
        <input type="number" id="lendCount" min="1" class="w-full border rounded-lg px-3 py-2.5" required>
        <p id="availableInfo" class="text-xs text-gray-500 mt-1">貸出可能台数: -</p>
      </div>
      <div>
        <label class="block mb-1.5 text-sm font-medium">配置/行き先</label>
        <input type="text" id="lendPlace" class="w-full border rounded-lg px-3 py-2.5" required>
      </div>
      <div>
        <label class="block mb-1.5 text-sm font-medium">備考（任意）</label>
        <textarea id="lendNote" rows="2" class="w-full border rounded-lg px-3 py-2.5" placeholder="特記事項があれば記入"></textarea>
      </div>
      <div id="assignPreview" class="bg-blue-50 p-3 rounded-lg hidden">
        <p class="text-sm font-medium text-blue-700 mb-1">自動割当される機器:</p>
        <p id="assignList" class="text-sm break-all"></p>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white px-4 py-3 rounded-lg hover:bg-blue-700 font-medium text-lg">
        ✅ 一括貸出実行
      </button>
    </form>
  </section>

  <!-- ===== 利用者別返却 ===== -->
  <section id="return" class="tab-content">
    <h2 class="text-lg font-semibold mb-3">📥 利用者別返却</h2>
    <form id="returnForm" class="space-y-3 bg-white p-4 rounded-lg shadow">
      <div>
        <label class="block mb-1.5 text-sm font-medium">利用者で絞り込み</label>
        <select id="returnUserFilter" class="w-full border rounded-lg px-3 py-2.5">
          <option value="">全て表示</option>
        </select>
      </div>
      <div>
        <label class="block mb-1.5 text-sm font-medium">返却する機器を選択 <span id="returnCount" class="text-green-600 font-normal">(0台選択中)</span></label>
        <div id="returnCheckList" class="border rounded-lg p-2 max-h-72 overflow-y-auto bg-gray-50">
          <p class="text-gray-400 text-sm p-2">貸出中の機器が表示されます</p>
        </div>
        <label class="mt-2.5 inline-flex items-center gap-2 cursor-pointer px-1 select-none">
          <input type="checkbox" id="returnSelectAll" class="rounded w-5 h-5">
          表示中のものを全て選択
        </label>
      </div>
      <div>
        <label class="block mb-1.5 text-sm font-medium">電池残量（一括設定）</label>
        <select id="returnBattery" class="w-full border rounded-lg px-3 py-2.5" required>
          <option value="full">🔋 十分</option>
          <option value="medium">🔌 中</option>
          <option value="low">⚠️ 少ない</option>
        </select>
      </div>
      <div>
        <label class="block mb-1.5 text-sm font-medium">備考（任意）</label>
        <textarea id="returnNote" rows="2" class="w-full border rounded-lg px-3 py-2.5" placeholder="特記事項があれば記入"></textarea>
      </div>
      <button type="submit" class="w-full bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 font-medium text-lg">
        ✅ 選択した機器を返却
      </button>
    </form>
  </section>

  <!-- ===== 在庫一覧 ===== -->
  <section id="list" class="tab-content">
    <h2 class="text-lg font-semibold mb-3">📋 在庫一覧</h2>
    <div id="categoryTables" class="space-y-4"></div>
  </section>

  <!-- ===== 履歴 ===== -->
  <section id="history" class="tab-content">
    <h2 class="text-lg font-semibold mb-3">📜 操作履歴</h2>
    <div class="flex justify-between items-center mb-3">
      <p class="text-xs text-gray-500">最新100件を表示</p>
      <button id="clearHistory" class="text-red-500 text-sm hover:text-red-700">履歴をクリア</button>
    </div>
    <div id="historyList" class="space-y-3"></div>
  </section>

  <!-- ===== 設定 ===== -->
  <section id="settings" class="tab-content">
    <h2 class="text-lg font-semibold mb-3">⚙️ 設定</h2>
    <div id="passwordArea" class="space-y-3">
      <input type="password" id="passwordInput" placeholder="パスワード" class="w-full border rounded-lg px-3 py-2.5">
      <button id="authBtn" class="w-full bg-gray-700 text-white px-4 py-3 rounded-lg hover:bg-gray-800 font-medium">認証</button>
    </div>
    <div id="settingsContent" class="hidden space-y-5 mt-4">
      <div class="p-3 bg-green-50 rounded-lg border border-green-200">
        <p class="text-green-700 text-sm font-medium">✅ クラウド接続済 — データは永続保存</p>
      </div>
      <!-- 品目種別管理 -->
      <div class="p-3 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2 text-sm">📦 品目種別管理</h3>
        <div class="flex gap-2 mb-3">
          <input type="text" id="newCategory" placeholder="例: トランシーバー" class="flex-1 border rounded-lg px-3 py-2.5">
          <button id="addCategory" class="bg-blue-500 text-white px-4 py-2.5 rounded-lg whitespace-nowrap">追加</button>
        </div>
        <ul id="categoryList" class="space-y-1.5 text-sm"></ul>
      </div>
      <!-- 利用者管理 -->
      <div class="p-3 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2 text-sm">👤 利用者管理</h3>
        <div class="flex gap-2 mb-3">
          <input type="text" id="newUser" placeholder="例: 田中" class="flex-1 border rounded-lg px-3 py-2.5">
          <button id="addUser" class="bg-blue-500 text-white px-4 py-2.5 rounded-lg whitespace-nowrap">追加</button>
        </div>
        <ul id="userList" class="space-y-1.5 text-sm"></ul>
      </div>
      <!-- 機器一括登録 -->
      <div class="p-3 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2 text-sm">📋 機器一括登録</h3>
        <select id="bulkCategory" class="w-full border rounded-lg px-3 py-2.5 mb-2">
          <option value="">種別を選択</option>
        </select>
        <input type="text" id="bulkPrefix" placeholder="例: TR-" class="w-full border rounded-lg px-3 py-2.5 mb-2">
        <div class="flex gap-2 mb-2">
          <input type="number" id="bulkStart" placeholder="開始番号" class="flex-1 border rounded-lg px-3 py-2.5">
          <input type="number" id="bulkEnd" placeholder="終了番号" class="flex-1 border rounded-lg px-3 py-2.5">
        </div>
        <button id="bulkAdd" class="w-full bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 font-medium">一括追加</button>
      </div>
    </div>
  </section>

  <script>
    // ==========================================
    // Firebase 設定
    // ==========================================
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAWVUxoXbvTraGUDozLztqcJx2f2fIHQntc",
      authDomain: "thsportsfes.firebaseapp.com",
      projectId: "thsportsfes",
      storageBucket: "thsportsfes.appspot.com",
      messagingSenderId: "96596815858",
      appId: "1:96596815858:web:5f85526bf785ccc5d8056b"
    };
    const PASSWORD = 'admin123';

    let db = null;
    let items = [];
    let history = [];
    let categories = [];
    let users = [];

    function nowTime() {
      return new Date().toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function showPopup(msg, type = 'success') {
      const col = { success: 'bg-green-500', error: 'bg-red-500', warning: 'bg-amber-500' };
      const el = Object.assign(document.createElement('div'), {
        className: `fixed top-4 left-1/2 -translate-x-1/2 ${col[type]} text-white px-5 py-2.5 rounded-lg shadow-lg z-50 text-sm`,
        textContent: msg
      });
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function setSync(online, text) {
      document.getElementById('syncDot').className = `sync-dot ${online ? 'sync-online' : 'sync-offline'}`;
      document.getElementById('syncText').textContent = text || (online ? '✅ オンライン' : '❌ オフライン');
    }

    // ==========================================
    // Firebase 初期化
    // ==========================================
    async function initFirebase() {
      try {
        const app = firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore(app);

        db.collection('equipment').onSnapshot(snap => {
          items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderAll();
          setSync(true, '✅ 接続完了');
        }, err => {
          showPopup('データ取得失敗: ' + err.message, 'error');
          setSync(false, '権限エラー');
        });

        db.collection('history').orderBy('timestamp', 'desc').limit(100).onSnapshot(snap => {
          history = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderHistory();
        }, err => console.error('履歴取得エラー:', err));

        db.collection('settings').doc('master').onSnapshot(snap => {
          if (snap.exists) {
            const d = snap.data();
            categories = d.categories || [];
            users = d.users || [];
          }
          renderAll();
        }, err => console.error('設定取得エラー:', err));

      } catch (e) {
        showPopup('Firebase接続失敗: ' + e.message, 'error');
      }
    }

    async function saveSettings() {
      await db.collection('settings').doc('master').set(
        { categories, users }, { merge: true }
      );
    }

    async function addEquipment(category, id) {
      await db.collection('equipment').doc(id).set({
        category, status: 'ok', user: '', place: '', battery: 'full',
        createdAt: nowTime()
      });
    }

    function getAvailableIds(category, count) {
      const avail = items.filter(i => i.category === category && i.status === 'ok');
      if (avail.length < count) return null;
      return avail.slice(0, count).map(i => i.id);
    }

    async function lendItemsBatchAuto(category, count, user, place, note) {
      const targetIds = getAvailableIds(category, count);
      if (!targetIds) return null;

      const batch = db.batch();
      const time = nowTime();
      targetIds.forEach(id => {
        const ref = db.collection('equipment').doc(id);
        batch.update(ref, {
          status: 'lend', user, place, noteLend: note,
          lendTime: time, lendTimestamp: new Date()
        });
      });
      await batch.commit();

      await db.collection('history').add({
        type: '貸出', category, count, user, place, note, ids: targetIds,
        timestamp: new Date(), time
      });
      return targetIds;
    }

    async function returnItemsBatch(idList, battery, note) {
      const batch = db.batch();
      const time = nowTime();
      idList.forEach(id => {
        const ref = db.collection('equipment').doc(id);
        batch.update(ref, {
          status: 'ok', battery, noteReturn: note,
          returnTime: time, returnTimestamp: new Date()
        });
      });
      await batch.commit();

      await db.collection('history').add({
        type: '返却', count: idList.length, battery, note, ids: idList,
        timestamp: new Date(), time
      });
      return true;
    }

    function renderAll() {
      renderSelects();
      renderReturnCheckList();
      renderList();
      renderSettings();
    }

    function renderSelects() {
      const catOpt = '<option value="">選択してください</option>' +
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
      const userOpt = '<option value="">選択してください</option>' +
        users.map(u => `<option value="${u}">${u}</option>`).join('');

      document.getElementById('lendCategory').innerHTML = catOpt;
      document.getElementById('bulkCategory').innerHTML = catOpt;
      document.getElementById('lendUser').innerHTML = userOpt;
      document.getElementById('returnUserFilter').innerHTML =
        '<option value="">全て表示</option>' +
        [...new Set(items.filter(i => i.status === 'lend').map(i => i.user))]
          .filter(Boolean).map(u => `<option value="${u}">${u}</option>`).join('');
    }

    function updateAssignPreview() {
      const cat = document.getElementById('lendCategory').value;
      const count = parseInt(document.getElementById('lendCount').value) || 0;
      const preview = document.getElementById('assignPreview');
      const info = document.getElementById('availableInfo');

      if (!cat || !count) {
        preview.classList.add('hidden');
        info.textContent = '貸出可能台数: -';
        info.classList.remove('text-red-500');
        return;
      }
      const avail = items.filter(i => i.category === cat && i.status === 'ok');
      info.textContent = `貸出可能台数: ${avail.length}台`;

      if (avail.length < count) {
        preview.classList.add('hidden');
        info.classList.add('text-red-500');
        return;
      }
      info.classList.remove('text-red-500');
      const ids = avail.slice(0, count).map(i => i.id);
      document.getElementById('assignList').textContent = ids.join(', ');
      preview.classList.remove('hidden');
    }

    function renderReturnCheckList() {
      const filter = document.getElementById('returnUserFilter').value;
      const container = document.getElementById('returnCheckList');
      let list = items.filter(i => i.status === 'lend');
      if (filter) list = list.filter(i => i.user === filter);

      if (!list.length) {
        container.innerHTML = '<p class="text-gray-400 text-sm p-2">該当する貸出中の機器はありません</p>';
        updateReturnCount();
        return;
      }
      container.innerHTML = list.map(i => `
        <label class="check-item flex items-center gap-2 rounded-lg border-b border-gray-100">
          <input type="checkbox" name="returnId" value="${i.id}" class="rounded w-5 h-5 flex-shrink-0">
          <div class="min-w-0">
            <div class="font-medium text-sm">${i.id}</div>
            <div class="text-xs text-gray-500">${i.user || '利用者不明'}</div>
          </div>
          <div class="ml-auto text-xs text-gray-400 flex-shrink-0">${i.lendTime || ''}</div>
        </label>`).join('');
      updateReturnCount();
    }

    function updateReturnCount() {
      const n = document.querySelectorAll('input[name="returnId"]:checked').length;
      document.getElementById('returnCount').textContent = `(${n}台選択中)`;
    }

    function renderList() {
      const cont = document.getElementById('categoryTables');
      cont.innerHTML = '';
      if (!categories.length) {
        cont.innerHTML = '<p class="text-gray-400 text-center p-4">設定タブから品目を追加してください</p>';
        return;
      }
      categories.forEach(cat => {
        const list = items.filter(i => i.category === cat);
        const ok = list.filter(i => i.status === 'ok').length;
        cont.innerHTML += `
          <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="p-3 bg-gray-50 font-medium text-sm">${cat} (貸出可: ${ok} / 全${list.length})</div>
            <div class="table-wrap">
              <table class="text-sm">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="p-2 text-left whitespace-nowrap">品番</th>
                    <th class="p-2 text-left whitespace-nowrap">状態</th>
                    <th class="p-2 text-left whitespace-nowrap">利用者</th>
                    <th class="p-2 text-left whitespace-nowrap">場所</th>
                    <th class="p-2 text-left whitespace-nowrap">貸出日時</th>
                    <th class="p-2 text-left whitespace-nowrap">備考</th>
                  </tr>
                </thead>
                <tbody>
                  ${list.length ? list.map(i => `
                    <tr class="border-t">
                      <td class="p-2 font-mono whitespace-nowrap">${i.id}</td>
                      <td class="p-2 whitespace-nowrap"><span class="px-2 py-0.5 rounded text-xs ${i.status==='lend'?'bg-red-100 text-red-700':'bg-green-100 text-green-700'}">${i.status==='lend'?'貸出中':'貸出可'}</span></td>
                      <td class="p-2 whitespace-nowrap">${i.user || '-'}</td>
                      <td class="p-2 whitespace-nowrap">${i.place || '-'}</td>
                      <td class="p-2 text-xs text-gray-500 whitespace-nowrap">${i.lendTime || '-'}</td>
                      <td class="p-2 text-xs text-gray-500 max-w-[120px] truncate">${i.noteLend || i.noteReturn || '-'}</td>
                    </tr>`).join('') : '<tr><td colspan="6" class="p-3 text-gray-400 text-center">データなし</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>`;
      });
    }

    function renderHistory() {
      const cont = document.getElementById('historyList');
      if (!history.length) {
        cont.innerHTML = '<p class="text-gray-400 text-center p-4">まだ操作履歴がありません</p>';
        return;
      }
      const icon = { '貸出': '📤', '返却': '📥' };
      cont.innerHTML = history.map(h => `
        <div class="bg-white p-3 rounded-lg shadow border-l-4 ${h.type==='貸出'?'border-blue-500':'border-green-500'}">
          <div class="flex justify-between items-start gap-2 mb-1">
            <div class="min-w-0">
              <span class="font-medium">${icon[h.type]} ${h.type}</span>
              <span class="text-xs text-gray-500 ml-1">${h.time}</span>
            </div>
            <span class="text-sm font-bold ${h.type==='貸出'?'text-blue-600':'text-green-600'} flex-shrink-0">${h.count}台</span>
          </div>
          <div class="text-sm text-gray-600 space-y-0.5">
            ${h.user ? `<div class="truncate">利用者: ${h.user}${h.place ? ` / ${h.place}` : ''}</div>` : ''}
            ${h.category ? `<div>種別: ${h.category}</div>` : ''}
            ${h.battery ? `<div>電池: ${h.battery==='full'?'🔋十分':h.battery==='medium'?'🔌中':'⚠️少ない'}</div>` : ''}
            ${h.note ? `<div class="text-gray-700 break-words">📝 ${h.note}</div>` : ''}
            <div class="text-xs text-gray-400 break-all">対象: ${h.ids.join(', ')}</div>
          </div>
        </div>`).join('');
    }

    function renderSettings() {
      // 品目種別一覧（削除ボタン付き）
      document.getElementById('categoryList').innerHTML = categories.map(c => {
        const usingCount = items.filter(i => i.category === c).length;
        return `
          <li class="flex items-center justify-between border-b py-2">
            <span>${c}</span>
            <button data-del-cat="${c}" class="text-red-500 hover:text-red-700 text-sm px-2 py-1 rounded hover:bg-red-50 ${usingCount > 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${usingCount > 0 ? 'disabled title="登録された機器が存在するため削除不可"' : ''}>
              ${usingCount > 0 ? '使用中' : '🗑️ 削除'}
            </button>
          </li>`;
      }).join('');

      // 利用者一覧（削除ボタン付き）
      document.getElementById('userList').innerHTML = users.map(u => {
        const usingCount = items.filter(i => i.user === u && i.status === 'lend').length;
        return `
          <li class="flex items-center justify-between border-b py-2">
            <span>${u}</span>
            <button data-del-user="${u}" class="text-red-500 hover:text-red-700 text-sm px-2 py-1 rounded hover:bg-red-50 ${usingCount > 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${usingCount > 0 ? 'disabled title='貸出中の機器が存在するため削除不可'' : ''}>
              ${usingCount > 0 ? '貸出中' : '🗑️ 削除'}
            </button>
          </li>`;
      }).join('');
    }

    // ==========================================
    // イベント：タブ切り替え
    // ==========================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('bg-blue-500', 'text-white');
          b.classList.add('bg-gray-200');
        });
        document.getElementById(btn.dataset.tab).classList.add('active');
        btn.classList.remove('bg-gray-200');
        btn.classList.add('bg-blue-500', 'text-white');
        renderAll();
      });
    });

    // ==========================================
    // イベント：貸出
    // ==========================================
    document.getElementById('lendCategory').addEventListener('change', updateAssignPreview);
    document.getElementById('lendCount').addEventListener('input', updateAssignPreview);

    document.getElementById('returnUserFilter').addEventListener('change', renderReturnCheckList);

    document.getElementById('returnSelectAll').addEventListener('change', e => {
      document.querySelectorAll('input[name="returnId"]').forEach(cb => cb.checked = e.target.checked);
      updateReturnCount();
    });
    document.addEventListener('change', e => {
      if (e.target.name === 'returnId') updateReturnCount();
    });

    document.getElementById('lendForm').addEventListener('submit', async e => {
      e.preventDefault();
      const cat = document.getElementById('lendCategory').value;
      const count = parseInt(document.getElementById('lendCount').value);
      const user = document.getElementById('lendUser').value;
      const place = document.getElementById('lendPlace').value;
      const note = document.getElementById('lendNote').value.trim();

      if (!cat || !count || !user || !place) {
        return showPopup('必須項目を入力してください', 'warning');
      }
      const avail = items.filter(i => i.category === cat && i.status === 'ok');
      if (avail.length < count) {
        return showPopup(`貸出可能台数が不足 (${avail.length}台)`, 'error');
      }
      const assigned = await lendItemsBatchAuto(cat, count, user, place, note);
      if (!assigned) return showPopup('割当に失敗しました', 'error');

      showPopup(`✅ ${assigned.join(', ')} 貸出完了`);
      e.target.reset();
      document.getElementById('assignPreview').classList.add('hidden');
      document.getElementById('availableInfo').textContent = '貸出可能台数: -';
    });

    // ==========================================
    // イベント：返却
    // ==========================================
    document.getElementById('returnForm').addEventListener('submit', async e => {
      e.preventDefault();
      const ids = Array.from(document.querySelectorAll('input[name="returnId"]:checked')).map(cb => cb.value);
      const battery = document.getElementById('returnBattery').value;
      const note = document.getElementById('returnNote').value.trim();

      if (!ids.length) return showPopup('返却する機器を選択してください', 'warning');

      await returnItemsBatch(ids, battery, note);
      showPopup(`✅ ${ids.length}台 返却完了`);
      e.target.reset();
      renderReturnCheckList();
    });

    // ==========================================
    // イベント：設定認証
    // ==========================================
    document.getElementById('authBtn').addEventListener('click', () => {
      if (document.getElementById('passwordInput').value === PASSWORD) {
        document.getElementById('passwordArea').classList.add('hidden');
        document.getElementById('settingsContent').classList.remove('hidden');
        showPopup('✅ 設定を開きました');
      } else {
        showPopup('パスワードが違います', 'warning');
      }
    });

    // ==========================================
    // イベント：品目種別追加
    // ==========================================
    document.getElementById('addCategory').addEventListener('click', async () => {
      const v = document.getElementById('newCategory').value.trim();
      if (!v || categories.includes(v)) return showPopup('無効または既存です', 'warning');
      categories.push(v);
      await saveSettings();
      showPopup(`✅ ${v} 追加`);
      document.getElementById('newCategory').value = '';
    });

    // ==========================================
    // イベント：品目種別削除
    // ==========================================
    document.addEventListener('click', async e => {
      const delCat = e.target.getAttribute('data-del-cat');
      if (delCat && !e.target.disabled) {
        if (!confirm(`「${delCat}」を削除してもよろしいですか？\n※機器が登録されている種別は削除できません`)) return;
        categories = categories.filter(c => c !== delCat);
        await saveSettings();
        showPopup(`✅ ${delCat} を削除しました`);
      }
    });

    // ==========================================
    // イベント：利用者追加
    // ==========================================
    document.getElementById('addUser').addEventListener('click', async () => {
      const v = document.getElementById('newUser').value.trim();
      if (!v || users.includes(v)) return showPopup('無効または既存です', 'warning');
      users.push(v);
      await saveSettings();
      showPopup(`✅ ${v} 追加`);
      document.getElementById('newUser').value = '';
    });

    // ==========================================
    // イベント：利用者削除
    // ==========================================
    document.addEventListener('click', async e => {
      const delUser = e.target.getAttribute('data-del-user');
      if (delUser && !e.target.disabled) {
        if (!confirm(`「${delUser}」を削除してもよろしいですか？\n※貸出中の機器がある利用者は削除できません`)) return;
        users = users.filter(u => u !== delUser);
        await saveSettings();
        showPopup(`✅ ${delUser} を削除しました`);
      }
    });

    // ==========================================
    // イベント：機器一括登録
    // ==========================================
    document.getElementById('bulkAdd').addEventListener('click', async () => {
      const cat = document.getElementById('bulkCategory').value;
      const pre = document.getElementById('bulkPrefix').value.trim();
      const s = parseInt(document.getElementById('bulkStart').value);
      const e = parseInt(document.getElementById('bulkEnd').value);
      if (!cat || !pre || !s || !e || s > e) return showPopup('入力値が不正です', 'warning');
      let added = 0;
      for (let i = s; i <= e; i++) {
        const id = pre + String(i).padStart(3, '0');
        if (!items.some(x => x.id === id)) {
          await addEquipment(cat, id);
          added++;
        }
      }
      showPopup(`✅ ${added}台 登録完了`);
    });

    // ==========================================
    // イベント：履歴クリア
    // ==========================================
    document.getElementById('clearHistory').addEventListener('click', async () => {
      if (!confirm('履歴を全て削除します。よろしいですか？')) return;
      const snap = await db.collection('history').get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      showPopup('✅ 履歴を削除しました');
    });

    initFirebase();
  </script>
</body>
</html>
