<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>78th Sports Festival Portal</title>
  <!-- リンクプレビュー設定 -->
  <meta name="description" content="体育祭進行管理システム｜備品貸出・進行スケジュールを一元管理">
  <meta property="og:title" content="78th Sports Festival Portal">
  <meta property="og:description" content="体育祭進行管理システム｜備品貸出・進行スケジュールを一元管理">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide アイコン -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* ===== 背景：グリッド + パーティクル ===== */
    body {
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,255,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 120%, rgba(251,191,36,0.05) 0%, transparent 60%),
        linear-gradient(180deg, #050505 0%, #0d0d0d 50%, #050505 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }
    .mouse-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
    }

    /* ===== カウントダウンカード ===== */
    .countdown-card {
      background: 
        linear-gradient(145deg, rgba(35,35,35,0.85), rgba(15,15,15,0.95));
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(30px);
      box-shadow: 
        0 30px 100px rgba(0,0,0,0.8),
        0 0 150px rgba(255,255,255,0.02),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.5);
      position: relative;
    }
    .countdown-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 30%, transparent 70%, rgba(251,191,36,0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ===== タイムブロック ===== */
    .time-block {
      background: 
        linear-gradient(180deg, rgba(50,50,50,0.9), rgba(20,20,20,0.95));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.7),
        0 12px 32px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.02),
        0 0 40px rgba(255,255,255,0.02);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .time-block:hover {
      transform: translateY(-2px);
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.7),
        0 16px 40px rgba(0,0,0,0.6),
        0 0 60px rgba(255,255,255,0.05);
    }
    .time-block::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }
    .time-block::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0,0,0,0.3);
      pointer-events: none;
    }
    .ms-block {
      background: 
        linear-gradient(180deg, rgba(70,55,25,0.95), rgba(40,28,10,0.98));
      border: 1px solid rgba(251,191,36,0.3);
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.6),
        0 12px 32px rgba(0,0,0,0.5),
        0 0 50px rgba(251,191,36,0.12);
    }
    .ms-block::after {
      background: rgba(0,0,0,0.2);
    }

    /* ===== 機能カード ===== */
    .func-card {
      background: 
        linear-gradient(145deg, rgba(35,35,35,0.8), rgba(18,18,18,0.95));
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .func-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transition: left 0.8s ease;
    }
    .func-card:hover::before {
      left: 100%;
    }
    .func-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, transparent, transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      transition: all 0.5s ease;
      pointer-events: none;
    }
    .func-card:hover::after {
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 40%, transparent 60%, rgba(255,255,255,0.1));
    }
    .func-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(255,255,255,0.2);
      box-shadow: 
        0 40px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.05),
        0 0 100px rgba(255,255,255,0.03);
    }
    .func-card-blue:hover {
      box-shadow: 
        0 40px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(59,130,246,0.1),
        0 0 80px rgba(59,130,246,0.08);
    }
    .func-card-emerald:hover {
      box-shadow: 
        0 40px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(16,185,129,0.1),
        0 0 80px rgba(16,185,129,0.08);
    }

    /* ===== アイコンボックス ===== */
    .icon-box {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .icon-box::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: inherit;
      filter: blur(15px);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -1;
    }
    .func-card:hover .icon-box::before {
      opacity: 0.6;
    }
    .func-card:hover .icon-box {
      transform: scale(1.15) rotate(-5deg);
    }

    /* ===== テキストスタイル ===== */
    .gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 40%, #a3a3a3 70%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 200%;
      animation: gradient-shift 8s ease infinite;
    }
    .glow-text {
      text-shadow: 
        0 0 40px rgba(255,255,255,0.15),
        0 0 80px rgba(255,255,255,0.08),
        0 0 120px rgba(255,255,255,0.03);
    }
    .trophy-glow {
      filter: 
        drop-shadow(0 0 20px rgba(251,191,36,0.4))
        drop-shadow(0 0 40px rgba(251,191,36,0.2));
      animation: trophy-pulse 3s ease-in-out infinite;
    }

    /* ===== ディバイダー ===== */
    .divider {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), rgba(251,191,36,0.3), rgba(255,255,255,0.2), transparent);
      height: 1px;
    }
    .divider-thin {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      height: 1px;
    }

    /* ===== アニメーション ===== */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .pulse-dot {
      animation: pulse-soft 1.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .float-num {
      animation: float 4.5s ease-in-out infinite;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .fade-in-up {
      animation: fadeInUp 1s ease-out forwards;
    }
    .delay-1 { animation-delay: 0.15s; opacity: 0; }
    .delay-2 { animation-delay: 0.3s; opacity: 0; }
    .delay-3 { animation-delay: 0.45s; opacity: 0; }
    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes trophy-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes number-flip {
      0% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(-10px); opacity: 0.5; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* ===== ステータスドット ===== */
    .status-dot {
      box-shadow: 0 0 10px rgba(34,197,94,0.6);
    }

    /* ===== レスポンシブ調整 ===== */
    @media (max-width: 640px) {
      .time-block {
        min-width: 65px !important;
        padding: 12px 8px !important;
      }
      .ms-block {
        min-width: 55px !important;
      }
    }
  </style>
</head>
<body class="text-white max-w-5xl mx-auto px-4 py-12 md:py-16 relative z-10">
  <!-- マウス追従グロー -->
  <div class="mouse-glow" id="mouseGlow"></div>

  <!-- ヘッダー -->
  <header class="text-center mb-16 fade-in-up relative z-10">
    <p class="text-gray-500 text-[10px] md:text-xs tracking-[0.4em] uppercase mb-6">78th Annual Event</p>
    <div class="flex items-center justify-center gap-4 mb-6">
      <i data-lucide="trophy" class="w-12 h-12 md:w-16 md:h-16 text-amber-400 trophy-glow"></i>
    </div>
    <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold tracking-tight gradient-text glow-text leading-tight">
      Sports Festival
    </h1>
    <p class="text-gray-400 mt-5 text-base md:text-lg tracking-[0.15em]">Portal System</p>
    <div class="divider w-40 mx-auto mt-10 rounded-full"></div>
  </header>

  <!-- カウントダウン -->
  <div class="countdown-card rounded-3xl p-8 md:p-12 lg:p-14 mb-16 text-center fade-in-up delay-1 relative z-10">
    <div class="flex items-center justify-center gap-2.5 mb-10">
      <div class="w-2 h-2 rounded-full bg-green-500 pulse-dot status-dot"></div>
      <p class="text-gray-400 text-[10px] md:text-xs tracking-[0.3em] uppercase">Countdown to October 1st</p>
    </div>
    
    <div id="countdown" class="flex justify-center gap-1.5 md:gap-3 lg:gap-5 flex-wrap items-end">
      <!-- 動的に挿入 -->
    </div>
    
    <div class="flex items-center justify-center gap-4 mt-12">
      <div class="divider-thin flex-1 max-w-[120px]"></div>
      <div class="flex items-center gap-2">
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-gray-500"></i>
        <p class="text-gray-500 text-[10px] md:text-xs tracking-[0.25em] uppercase">2026.10.01</p>
      </div>
      <div class="divider-thin flex-1 max-w-[120px]"></div>
    </div>
  </div>

  <!-- 機能メニュー -->
  <h2 class="text-base md:text-lg font-semibold mb-10 text-center text-gray-400 tracking-[0.2em] uppercase fade-in-up delay-2 relative z-10">
    <span class="inline-flex items-center gap-3">
      <span class="w-8 h-px bg-gray-600"></span>
      <span class="inline-flex items-center gap-2">
        <i data-lucide="layout-grid" class="w-4 h-4 md:w-5 md:h-5"></i>
        Features
      </span>
      <span class="w-8 h-px bg-gray-600"></span>
    </span>
  </h2>
  <div class="grid gap-6 md:gap-8 sm:grid-cols-2 fade-in-up delay-3 relative z-10">
    <a href="lend.html" class="func-card func-card-blue p-8 md:p-10 rounded-2xl block group">
      <div class="icon-box w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500/25 to-blue-700/10 border border-blue-500/25 flex items-center justify-center mb-7">
        <i data-lucide="radio" class="w-8 h-8 text-blue-400"></i>
      </div>
      <h3 class="font-bold text-xl md:text-2xl mb-3 text-white tracking-tight">備品貸出管理</h3>
      <p class="text-sm text-gray-400 leading-relaxed">機器の貸出・返却・在庫状況をリアルタイムで一元管理</p>
      <div class="mt-8 flex items-center text-sm text-gray-500 group-hover:text-white group-hover:translate-x-2 transition-all duration-400 font-medium">
        <span>開く</span>
        <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
      </div>
    </a>
    <a href="timetable.html" class="func-card func-card-emerald p-8 md:p-10 rounded-2xl block group">
      <div class="icon-box w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500/25 to-emerald-700/10 border border-emerald-500/25 flex items-center justify-center mb-7">
        <i data-lucide="clipboard-list" class="w-8 h-8 text-emerald-400"></i>
      </div>
      <h3 class="font-bold text-xl md:text-2xl mb-3 text-white tracking-tight">進行管理</h3>
      <p class="text-sm text-gray-400 leading-relaxed">球技日・団体競技日のスケジュールと進捗状況を確認</p>
      <div class="mt-8 flex items-center text-sm text-gray-500 group-hover:text-white group-hover:translate-x-2 transition-all duration-400 font-medium">
        <span>開く</span>
        <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
      </div>
    </a>
  </div>

  <!-- フッター -->
  <footer class="mt-20 text-center fade-in-up delay-3 relative z-10">
    <p class="text-gray-600 text-[10px] tracking-[0.3em] uppercase">© 78th Sports Festival Executive Committee</p>
  </footer>

  <script>
    // Lucide アイコン初期化
    lucide.createIcons();

    // マウス追従グロー
    const mouseGlow = document.getElementById('mouseGlow');
    document.addEventListener('mousemove', (e) => {
      mouseGlow.style.left = e.clientX + 'px';
      mouseGlow.style.top = e.clientY + 'px';
    });

    const TARGET = new Date('2026-10-01T00:00:00');
    
    function pad(n, d = 2) {
      return String(n).padStart(d, '0');
    }

    function updateCountdown() {
      const now = new Date();
      const diff = TARGET - now;
      const container = document.getElementById('countdown');

      if (diff <= 0) {
        container.innerHTML = `
          <div class="w-full py-12">
            <div class="flex items-center justify-center gap-3 mb-6">
              <i data-lucide="party-popper" class="w-12 h-12 text-amber-400 trophy-glow"></i>
            </div>
            <p class="text-3xl md:text-5xl lg:text-6xl font-bold gradient-text glow-text tracking-tight">体育祭当日！</p>
            <p class="text-gray-400 mt-6 tracking-[0.15em]">Let's make it unforgettable!</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      const ms = Math.floor((diff % 1000) / 10);

      container.innerHTML = `
        <div class="time-block rounded-2xl px-5 py-5 md:px-8 md:py-8 lg:px-10 lg:py-9 min-w-[90px] md:min-w-[120px] lg:min-w-[140px] float-num">
          <div class="font-mono-num text-3xl md:text-5xl lg:text-7xl font-extrabold text-white leading-none tracking-tight">${days}</div>
          <div class="text-[9px] md:text-[10px] text-gray-500 mt-4 tracking-[0.25em] uppercase font-medium">Days</div>
        </div>
        <div class="text-gray-600 text-2xl md:text-3xl lg:text-4xl font-light hidden sm:inline pb-8 pulse-dot">:</div>
        <div class="time-block rounded-2xl px-5 py-5 md:px-8 md:py-8 lg:px-10 lg:py-9 min-w-[75px] md:min-w-[100px] lg:min-w-[120px] float-num" style="animation-delay: 0.4s">
          <div class="font-mono-num text-3xl md:text-5xl lg:text-7xl font-extrabold text-white leading-none tracking-tight">${pad(hours)}</div>
          <div class="text-[9px] md:text-[10px] text-gray-500 mt-4 tracking-[0.25em] uppercase font-medium">Hours</div>
        </div>
        <div class="text-gray-600 text-2xl md:text-3xl lg:text-4xl font-light hidden sm:inline pb-8 pulse-dot">:</div>
        <div class="time-block rounded-2xl px-5 py-5 md:px-8 md:py-8 lg:px-10 lg:py-9 min-w-[75px] md:min-w-[100px] lg:min-w-[120px] float-num" style="animation-delay: 0.8s">
          <div class="font-mono-num text-3xl md:text-5xl lg:text-7xl font-extrabold text-white leading-none tracking-tight">${pad(mins)}</div>
          <div class="text-[9px] md:text-[10px] text-gray-500 mt-4 tracking-[0.25em] uppercase font-medium">Mins</div>
        </div>
        <div class="text-gray-600 text-2xl md:text-3xl lg:text-4xl font-light hidden sm:inline pb-8 pulse-dot">:</div>
        <div class="time-block rounded-2xl px-5 py-5 md:px-8 md:py-8 lg:px-10 lg:py-9 min-w-[75px] md:min-w-[100px] lg:min-w-[120px] float-num" style="animation-delay: 1.2s">
          <div class="font-mono-num text-3xl md:text-5xl lg:text-7xl font-extrabold text-white leading-none tracking-tight">${pad(secs)}</div>
          <div class="text-[9px] md:text-[10px] text-gray-500 mt-4 tracking-[0.25em] uppercase font-medium">Secs</div>
        </div>
        <div class="ms-block rounded-2xl px-4 py-5 md:px-6 md:py-8 lg:px-8 lg:py-9 min-w-[65px] md:min-w-[85px] lg:min-w-[100px] float-num" style="animation-delay: 1.6s">
          <div class="font-mono-num text-2xl md:text-4xl lg:text-6xl font-extrabold text-amber-400 leading-none tracking-tight" style="text-shadow: 0 0 25px rgba(251,191,36,0.4);">${pad(ms)}</div>
          <div class="text-[9px] md:text-[10px] text-amber-400/60 mt-4 tracking-[0.25em] uppercase font-medium">MS</div>
        </div>
      `;
    }

    updateCountdown();
    setInterval(updateCountdown, 10);
  </script>
</body>
</html>
