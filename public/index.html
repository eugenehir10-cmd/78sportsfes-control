<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="description" content="第78回体育祭進行管理システム｜備品貸出・進行スケジュールを一元管理">
  <meta property="og:title" content="78th Sports Festival Portal">
  <meta property="og:description" content="第78回体育祭進行管理システム｜備品貸出・進行スケジュールを一元管理">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-uo7y4d541q/a3ab12918aba45a2a2329845f6dcc9e9.jpg~tplv-0es2k971ck-image.image?rcl=202609240247184651974C1893822DA5C7&rk3s=8e244e95&rrcfp=935dee89&x-expires=1790794039&x-signature=CNjmqAzc0rP2t6PzpuA9Xa2Qioc%3D">
  <meta name="twitter:card" content="summary_large_image">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide アイコン -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* ===== 背景：グリッド + 星屑パーティクル ===== */
    body {
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,255,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 10% 100%, rgba(59,130,246,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%, rgba(16,185,129,0.04) 0%, transparent 60%),
        linear-gradient(180deg, #050505 0%, #0a0a0a 50%, #050505 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 25%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 85%);
      pointer-events: none;
      z-index: 0;
    }
    /* 星屑パーティクル */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: particle-float linear infinite;
    }
    @keyframes particle-float {
      0% {
        opacity: 0;
        transform: translateY(100vh) translateX(0);
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        opacity: 0;
        transform: translateY(-10vh) translateX(50px);
      }
    }

    .mouse-glow {
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
    }

    /* ===== ロゴスタイル ===== */
    .logo-main {
      filter: 
        drop-shadow(0 0 30px rgba(255,255,255,0.15))
        drop-shadow(0 0 60px rgba(255,255,255,0.05));
      animation: logo-float 5s ease-in-out infinite;
    }
    .logo-small {
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));
    }

    /* ===== カウントダウンカード ===== */
    .countdown-card {
      background: 
        linear-gradient(145deg, rgba(32,32,32,0.85), rgba(12,12,12,0.95));
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(30px);
      box-shadow: 
        0 30px 100px rgba(0,0,0,0.85),
        0 0 150px rgba(255,255,255,0.02),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .countdown-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 25%, transparent 75%, rgba(255,255,255,0.08));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .countdown-card::after {
      content: '';
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: url('https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-uo7y4d541q/a3ab12918aba45a2a2329845f6dcc9e9.jpg~tplv-0es2k971ck-image.image?rcl=202609240247184651974C1893822DA5C7&rk3s=8e244e95&rrcfp=935dee89&x-expires=1790794039&x-signature=CNjmqAzc0rP2t6PzpuA9Xa2Qioc%3D') center/contain no-repeat;
      opacity: 0.15;
      pointer-events: none;
    }

    /* ===== タイムブロック ===== */
    .time-block {
      background: 
        linear-gradient(180deg, rgba(48,48,48,0.9), rgba(18,18,18,0.95));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.75),
        0 12px 32px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.02),
        0 0 40px rgba(255,255,255,0.02);
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .time-block:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.75),
        0 20px 45px rgba(0,0,0,0.7),
        0 0 70px rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.2);
    }
    .time-block::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    }
    .time-block::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
    }
    .ms-block {
      background: 
        linear-gradient(180deg, rgba(55,55,55,0.95), rgba(22,22,22,0.98));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.7),
        0 12px 32px rgba(0,0,0,0.55),
        0 0 50px rgba(255,255,255,0.05);
    }
    .ms-block::after {
      background: rgba(0,0,0,0.25);
    }

    /* ===== 機能カード ===== */
    .func-card {
      background: 
        linear-gradient(145deg, rgba(32,32,32,0.8), rgba(15,15,15,0.95));
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .func-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transition: left 0.9s ease;
    }
    .func-card:hover::before {
      left: 100%;
    }
    .func-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, transparent, transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      transition: all 0.5s ease;
      pointer-events: none;
    }
    .func-card:hover::after {
      background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 35%, transparent 65%, rgba(255,255,255,0.12));
    }
    .func-card:hover {
      transform: translateY(-12px) scale(1.025);
      border-color: rgba(255,255,255,0.22);
      box-shadow: 
        0 45px 90px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.05),
        0 0 100px rgba(255,255,255,0.04);
    }
    .func-card-blue:hover {
      box-shadow: 
        0 45px 90px rgba(0,0,0,0.7),
        0 0 0 1px rgba(59,130,246,0.12),
        0 0 90px rgba(59,130,246,0.1);
    }
    .func-card-emerald:hover {
      box-shadow: 
        0 45px 90px rgba(0,0,0,0.7),
        0 0 0 1px rgba(16,185,129,0.12),
        0 0 90px rgba(16,185,129,0.1);
    }

    /* ===== アイコンボックス ===== */
    .icon-box {
      transition: all 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .icon-box::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: inherit;
      background: inherit;
      filter: blur(18px);
      opacity: 0;
      transition: opacity 0.55s ease;
      z-index: -1;
    }
    .func-card:hover .icon-box::before {
      opacity: 0.7;
    }
    .func-card:hover .icon-box {
      transform: scale(1.18) rotate(-6deg);
    }

    /* ===== テキストスタイル ===== */
    .gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 30%, #c8c8c8 55%, #f0f0f0 80%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 200%;
      animation: gradient-shift 10s ease infinite;
    }
    .glow-text {
      text-shadow: 
        0 0 50px rgba(255,255,255,0.18),
        0 0 100px rgba(255,255,255,0.08);
    }

    /* ===== ディバイダー ===== */
    .divider {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), rgba(255,255,255,0.25), rgba(255,255,255,0.15), transparent);
      height: 1px;
    }
    .divider-thin {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      height: 1px;
    }
    .section-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-divider::before,
    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15));
    }
    .section-divider::after {
      background: linear-gradient(90deg, rgba(255,255,255,0.15), transparent);
    }

    /* ===== アニメーション ===== */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    .pulse-dot {
      animation: pulse-soft 1.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .float-num {
      animation: float 5s ease-in-out infinite;
    }
    @keyframes logo-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .fade-in-up {
      animation: fadeInUp 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .delay-1 { animation-delay: 0.2s; opacity: 0; }
    .delay-2 { animation-delay: 0.4s; opacity: 0; }
    .delay-3 { animation-delay: 0.6s; opacity: 0; }
    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ===== ステータスドット ===== */
    .status-dot {
      box-shadow: 0 0 12px rgba(34,197,94,0.7);
    }

    /* ===== レスポンシブ調整 ===== */
    @media (max-width: 640px) {
      .time-block {
        min-width: 60px !important;
        padding: 10px 6px !important;
      }
      .ms-block {
        min-width: 50px !important;
      }
    }
  </style>
</head>
<body class="text-white max-w-5xl mx-auto px-4 py-12 md:py-16 relative z-10">

  <!-- ヘッダー -->
  <header class="text-center mb-16 fade-in-up relative z-10">

    <!-- メインロゴ -->
    <div class="flex items-center justify-center mb-8">
      <div class="relative">
        <img 
          src="https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-uo7y4d541q/a3ab12918aba45a2a2329845f6dcc9e9.jpg~tplv-0es2k971ck-image.image?rcl=202609240247184651974C1893822DA5C7&rk3s=8e244e95&rrcfp=935dee89&x-expires=1790794039&x-signature=CNjmqAzc0rP2t6PzpuA9Xa2Qioc%3D"

  <!-- フッター -->
  <footer class="mt-24 text-center fade-in-up delay-3 relative z-10 pb-8">

        src="https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-uo7y4d541q/a3ab12918aba45a2a2329845f6dcc9e9.jpg~tplv-0es2k971ck-image.image?rcl=202609240247184651974C1893822DA5C7&rk3s=8e244e95&rrcfp=935dee89&x-expires=1790794039&x-signature=CNjmqAzc0rP2t6PzpuA9Xa2Qioc%3D" 
        alt="78th Logo" 
        class="logo-small w-8 h-8"
      >
    </div>
    <p class="text-gray-600 text-[10px] tracking-[0.35em] uppercase">© 78th Sports Festival Executive Committee</p>
  </footer>

  <script>
    // Lucide アイコン初期化
    lucide.createIcons();

    // 星屑パーティクル生成
    const particlesContainer = document.getElementById('particles');
    const particleCount = 60;
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (15 + Math.random() * 20) + 's';
      particle.style.animationDelay = Math.random() * 20 + 's';
      particle.style.width = (1 + Math.random() * 2) + 'px';
      particle.style.height = particle.style.width;
      particle.style.opacity = 0.3 + Math.random() * 0.4;
      particlesContainer.appendChild(particle);
    }

    // マウス追従グロー
    const mouseGlow = document.getElementById('mouseGlow');
    document.addEventListener('mousemove', (e) => {
      mouseGlow.style.left = e.clientX + 'px';
      mouseGlow.style.top = e.clientY + 'px';
    });

    const TARGET = new Date('2026-10-01T00:00:00');
    
    function pad(n, d = 2) {
      return String(n).padStart(d, '0');
    }

    function updateCountdown() {
      const now = new Date();
      const diff = TARGET - now;
      const container = document.getElementById('countdown');

      if (diff <= 0) {
        container.innerHTML = `
          <div class="w-full py-12">
            <div class="flex items-center justify-center gap-3 mb-6">
              <img 
                src="https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-uo7y4d541q/a3ab12918aba45a2a2329845f6dcc9e9.jpg~tplv-0es2k971ck-image.image?rcl=202609240247184651974C1893822DA5C7&rk3s=8e244e95&rrcfp=935dee89&x-expires=1790794039&x-signature=CNjmqAzc0rP2t6PzpuA9Xa2Qioc%3D" 
                alt="78th Logo" 
                class="w-16 h-16"
                style="filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));"
              >
            </div>
            <p class="text-3xl md:text-5xl lg:text-6xl font-bold gradient-text glow-text tracking-[0.1em]">体育祭当日！</p>
            <p class="text-gray-400 mt-6 tracking-[0.2em] uppercase text-sm">Let's make it unforgettable!</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      const ms = Math.floor((diff % 1000) / 10);

      container.innerHTML = `
