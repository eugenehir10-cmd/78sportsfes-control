<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>スポーツフェスタ・ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }
    .countdown-box {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .func-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .func-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="text-white max-w-4xl mx-auto px-4 py-8">
  <header class="text-center mb-10">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">🏆 スポーツフェスタ・ポータル</h1>
    <p class="text-blue-100">体育祭進行管理システム</p>
  </header>

  <!-- カウントダウン -->
  <div class="countdown-box rounded-2xl p-6 md:p-8 mb-10 text-center">
    <p class="text-blue-100 mb-3">体育祭まであと</p>
    <div id="countdown" class="text-4xl md:text-5xl font-mono font-bold tracking-wider">
      読み込み中...
    </div>
    <p class="text-sm text-blue-200 mt-2">～ 10月1日</p>
  </div>

  <!-- 機能メニュー -->
  <h2 class="text-xl font-bold mb-4 text-center">📂 機能メニュー</h2>
  <div class="grid gap-4 sm:grid-cols-2">
    <a href="lend.html" class="func-card bg-white/95 text-gray-800 p-6 rounded-xl shadow-lg block">
      <div class="text-3xl mb-2">📻</div>
      <h3 class="font-bold text-lg mb-1">備品貸出管理</h3>
      <p class="text-sm text-gray-500">機器の貸出・返却・在庫管理</p>
    </a>
    <a href="timetable.html" class="func-card bg-white/95 text-gray-800 p-6 rounded-xl shadow-lg block">
      <div class="text-3xl mb-2">📋</div>
      <h3 class="font-bold text-lg mb-1">進行管理</h3>
      <p class="text-sm text-gray-500">球技日・団体競技日のスケジュール</p>
    </a>
  </div>

  <script>
    const TARGET = new Date('2026-10-01T00:00:00');
    function pad(n, d=2) { return String(n).padStart(d, '0'); }
    
    function updateCountdown() {
      const now = new Date();
      const diff = TARGET - now;
      
      if (diff <= 0) {
        document.getElementById('countdown').innerHTML = '🎉 体育祭当日！';
        return;
      }
      
      const days = Math.floor(diff / (1000*60*60*24));
      const hours = Math.floor((diff / (1000*60*60)) % 24);
      const mins = Math.floor((diff / (1000*60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      const ms = Math.floor((diff % 1000) / 10);
      
      document.getElementById('countdown').innerHTML = `
        <span class="inline-block min-w-[60px]">${days}</span>日
        <span class="inline-block min-w-[50px]">${pad(hours)}</span>:
        <span class="inline-block min-w-[50px]">${pad(mins)}</span>:
        <span class="inline-block min-w-[50px]">${pad(secs)}</span>.
        <span class="inline-block min-w-[40px] text-yellow-300">${pad(ms)}</span>
      `;
    }
    
    updateCountdown();
    setInterval(updateCountdown, 10);
  </script>
</body>
</html>
