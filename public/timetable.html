<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>進行管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card { 
      background: #fff; 
      border-radius: 12px; 
      padding: 1.25rem; 
      margin-bottom: 1rem; 
      box-shadow: 0 2px 8px rgba(0,0,0,.12); 
    }
    .menu-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0,0,0,.15);
    }
    .progress-bar {
      height: 8px;
      border-radius: 4px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 max-w-3xl mx-auto p-3 md:p-6 pb-8">
  <!-- ヘッダー -->
  <header class="mb-6 mt-2">
    <a href="index.html" class="inline-flex items-center gap-2 text-lg font-bold hover:opacity-70 transition-opacity mb-2">
      ← ホームに戻る
    </a>
    <h1 class="text-2xl font-bold">📋 進行管理</h1>
  </header>

  <!-- 全体概要 -->
  <div class="card bg-gradient-to-r from-indigo-50 to-blue-50 border border-blue-100 mb-6">
    <h2 class="font-bold text-lg mb-4">📊 全体の状況</h2>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <p class="text-sm text-gray-500 mb-1">球技日</p>
        <p class="font-bold text-xl" id="ballProgress">読込中...</p>
        <div class="progress-bar mt-2">
          <div id="ballBar" class="progress-fill bg-blue-500" style="width:0%"></div>
        </div>
      </div>
      <div>
        <p class="text-sm text-gray-500 mb-1">団体競技日</p>
        <p class="font-bold text-xl" id="teamProgress">読込中...</p>
        <div class="progress-bar mt-2">
          <div id="teamBar" class="progress-fill bg-green-500" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ページ分岐メニュー -->
  <h2 class="text-lg font-bold mb-3">📂 日程を選択</h2>
  <div class="grid gap-4 md:grid-cols-2">
    <a href="ball-sports.html" class="menu-card card block">
      <div class="text-3xl mb-2">⚽</div>
      <h3 class="font-bold text-lg mb-1">球技日 タイムテーブル</h3>
      <p class="text-sm text-gray-500 mb-3">複数会場で同時進行される試合を見やすく管理</p>
      <div class="flex items-center text-sm font-medium text-blue-600">
        開く →
      </div>
    </a>

    <a href="team-events.html" class="menu-card card block">
      <div class="text-3xl mb-2">🏃</div>
      <h3 class="font-bold text-lg mb-1">団体競技日 進行管理</h3>
      <p class="text-sm text-gray-500 mb-3">種目別のスケジュール・遅延管理・全体の進捗を把握</p>
      <div class="flex items-center text-sm font-medium text-green-600">
        開く →
      </div>
    </a>
  </div>

  <!-- 最新の状況サマリー -->
  <div class="card mt-8">
    <h2 class="font-bold text-lg mb-3">📌 最新の状況</h2>
    <div id="summary" class="space-y-4 text-sm">
      <p class="text-gray-400">データを読み込んでいます...</p>
    </div>
  </div>

  <script>
    function loadBallData() {
      try { return JSON.parse(localStorage.getItem('ball_sports_data') || '{"venues":[],"matches":[]}'); }
      catch { return { venues:[], matches:[] }; }
    }
    function loadTeamData() {
      try { return JSON.parse(localStorage.getItem('team_events_data') || '{"events":[]}'); }
      catch { return { events:[] }; }
    }

    function render() {
      const ball = loadBallData();
      const team = loadTeamData();

      // 球技日の進捗計算
      const ballDone = ball.matches.filter(m => m.status === 'done').length;
      const ballTotal = ball.matches.length;
      const ballPct = ballTotal ? Math.round(ballDone / ballTotal * 100) : 0;
      document.getElementById('ballProgress').textContent = `${ballDone}/${ballTotal} 試合終了`;
      document.getElementById('ballBar').style.width = `${ballPct}%`;

      // 団体競技日の進捗計算
      const teamDone = team.events.filter(e => e.status === 'done').length;
      const teamTotal = team.events.length;
      const teamPct = teamTotal ? Math.round(teamDone / teamTotal * 100) : 0;
      document.getElementById('teamProgress').textContent = `${teamDone}/${teamTotal} 種目終了`;
      document.getElementById('teamBar').style.width = `${teamPct}%`;

      // サマリー作成
      const summary = document.getElementById('summary');
      let html = '';

      // 球技：進行中の試合
      const ballRunning = ball.matches.filter(m => m.status === 'running');
      html += `<div><p class="font-bold text-blue-600 mb-1">⚽ 球技日 進行中</p>`;
      if (ballRunning.length) {
        html += ballRunning.map(m => `<p class="ml-3">・${m.venue}：${m.name}（${m.time}）</p>`).join('');
      } else {
        html += `<p class="ml-3 text-gray-400">現在進行中の試合はありません</p>`;
      }
      html += `</div>`;

      // 団体：進行中の種目
      const teamRunning = team.events.filter(e => e.status === 'running' || e.status === 'delay');
      html += `<div><p class="font-bold text-green-600 mb-1">🏃 団体競技日 進行中</p>`;
      if (teamRunning.length) {
        html += teamRunning.map(e => `<p class="ml-3">・${e.name}（${e.time}${e.delay?` +${e.delay}分`:''}）</p>`).join('');
      } else {
        html += `<p class="ml-3 text-gray-400">現在進行中の種目はありません</p>`;
      }
      html += `</div>`;

      summary.innerHTML = html;
    }

    render();
    // 定期的に更新
    setInterval(render, 2000);
  </script>
</body>
</html>
