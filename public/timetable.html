<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>進行管理｜スポーツフェスタ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide アイコン -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }
    body {
      background: 
        radial-gradient(ellipse at top, rgba(255,255,255,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(255,255,255,0.03) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a0a 0%, #141414 50%, #0a0a0a 100%);
      min-height: 100vh;
    }
    .card {
      background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(20,20,20,0.95));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      box-shadow: 
        0 25px 80px rgba(0,0,0,0.6),
        0 0 120px rgba(255,255,255,0.02),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .hub-card {
      background: linear-gradient(145deg, rgba(30,30,30,0.85), rgba(22,22,22,0.95));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .hub-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      transition: left 0.6s ease;
    }
    .hub-card:hover::before {
      left: 100%;
    }
    .hub-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255,255,255,0.18);
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.05),
        0 0 60px rgba(255,255,255,0.03);
    }
    .hub-card.ball:hover {
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(59, 130, 246, 0.1),
        0 0 80px rgba(59, 130, 246, 0.08);
    }
    .hub-card.team:hover {
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(16, 185, 129, 0.1),
        0 0 80px rgba(16, 185, 129, 0.08);
    }
    .status-running {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }
    .status-pending {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
    }
    .status-done {
      background: rgba(75,85,99,0.5);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .glow-text {
      text-shadow: 
        0 0 40px rgba(255,255,255,0.12),
        0 0 80px rgba(255,255,255,0.05);
    }
    .divider {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      height: 1px;
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-dot {
      animation: pulse-soft 1.2s ease-in-out infinite;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }
    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.3s; opacity: 0; }
  </style>
</head>
<body class="text-white max-w-5xl mx-auto px-4 py-12 md:py-16">
  <!-- 戻るヘッダー -->
  <header class="mb-14 fade-in-up">
    <a href="index.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors mb-4">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>ホームに戻る</span>
    </a>
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div>
        <p class="text-gray-500 text-xs tracking-[0.25em] uppercase mb-2">Schedule Management</p>
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight glow-text flex items-center gap-3">
          <i data-lucide="clipboard-list" class="w-10 h-10 md:w-12 md:h-12 text-emerald-400" style="filter: drop-shadow(0 0 20px rgba(16,185,129,0.3));"></i>
          進行管理
        </h1>
        <p class="text-gray-400 mt-3 text-sm md:text-base tracking-wide">球技日・団体競技日 のスケジュールを一元管理</p>
      </div>
    </div>
    <div class="divider w-full mt-8 rounded-full"></div>
  </header>

  <!-- 全体状況カード -->
  <div class="card rounded-3xl p-6 md:p-8 mb-12 fade-in-up delay-1">
    <div class="flex items-center justify-center gap-2 mb-6">
      <div class="w-2 h-2 rounded-full bg-green-500 pulse-dot"></div>
      <p class="text-gray-400 text-xs tracking-[0.25em] uppercase">現在の状況</p>
    </div>
    <div class="grid gap-4 md:grid-cols-2">
      <div class="bg-white/5 rounded-2xl p-5 border border-white/5">
        <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">⚽ 球技日 進行中</p>
        <p id="ballNowRunning" class="text-xl md:text-2xl font-bold text-blue-400">-</p>
      </div>
      <div class="bg-white/5 rounded-2xl p-5 border border-white/5">
        <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">🏃 団体競技 進行中</p>
        <p id="teamNowRunning" class="text-xl md:text-2xl font-bold text-emerald-400">-</p>
      </div>
    </div>
  </div>

  <!-- ハブカード -->
  <h2 class="text-lg md:text-xl font-semibold mb-8 text-center text-gray-300 tracking-wide fade-in-up delay-2">
    <span class="inline-flex items-center gap-2">
      <i data-lucide="layout-grid" class="w-5 h-5"></i>
      日程を選択
    </span>
  </h2>

  <div class="grid gap-6 md:grid-cols-2 fade-in-up delay-3">
    <!-- 球技日 -->
    <a href="ball_sports.html" class="hub-card ball p-8 rounded-2xl block group">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500/20 to-blue-600/10 border border-blue-500/20 flex items-center justify-center mb-6 group-hover:scale-110 group-hover:rotate-3 transition-all duration-500">
        <i data-lucide="trophy" class="w-8 h-8 text-blue-400"></i>
      </div>
      <h3 class="font-bold text-2xl md:text-3xl mb-2 text-white tracking-tight">⚽ 球技日</h3>
      <p class="text-sm text-gray-400 leading-relaxed mb-6">コート別タイムテーブルで試合進行を管理</p>
      
      <div class="space-y-2 mb-6 text-sm">
        <div class="flex items-center gap-2 text-gray-400">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-blue-400"></i>
          <span>会場ごとの並列表示</span>
        </div>
        <div class="flex items-center gap-2 text-gray-400">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-blue-400"></i>
          <span>状況・スコアのリアルタイム更新</span>
        </div>
        <div class="flex items-center gap-2 text-gray-400">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-blue-400"></i>
          <span>会場の追加・削除に対応</span>
        </div>
      </div>

      <div class="flex items-center justify-between pt-4 border-t border-white/5">
        <div>
          <p class="text-xs text-gray-500 mb-1">次の試合</p>
          <p id="ballNextMatch" class="text-sm font-medium text-white">-</p>
        </div>
        <div class="flex items-center text-sm text-gray-500 group-hover:text-blue-400 transition-colors">
          <span>開く</span>
          <i data-lucide="arrow-right" class="w-4 h-4 ml-1.5 group-hover:translate-x-1 transition-transform"></i>
        </div>
      </div>
    </a>

    <!-- 団体競技日 -->
    <a href="team_events.html" class="hub-card team p-8 rounded-2xl block group">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-emerald-600/10 border border-emerald-500/20 flex items-center justify-center mb-6 group-hover:scale-110 group-hover:-rotate-3 transition-all duration-500">
        <i data-lucide="users" class="w-8 h-8 text-emerald-400"></i>
      </div>
      <h3 class="font-bold text-2xl md:text-3xl mb-2 text-white tracking-tight">🏃 団体競技日</h3>
      <p class="text-sm text-gray-400 leading-relaxed mb-6">種目別の進行状況と遅延を一元管理</p>
      
      <div class="space-y-2 mb-6 text-sm">
        <div class="flex items-center gap-2 text-gray-400">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
          <span>ステータス別の色分け表示</span>
        </div>
        <div class="flex items-center gap-2 text-gray-400">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
          <span>遅延時間の自動計算</span>
        </div>
        <div class="flex items-center gap-2 text-gray-400">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
          <span>全体進捗バーで可視化</span>
        </div>
      </div>

      <div class="flex items-center justify-between pt-4 border-t border-white/5">
        <div>
          <p class="text-xs text-gray-500 mb-1">次の種目</p>
          <p id="teamNextEvent" class="text-sm font-medium text-white">-</p>
        </div>
        <div class="flex items-center text-sm text-gray-500 group-hover:text-emerald-400 transition-colors">
          <span>開く</span>
          <i data-lucide="arrow-right" class="w-4 h-4 ml-1.5 group-hover:translate-x-1 transition-transform"></i>
        </div>
      </div>
    </a>
  </div>

  <script>
    // Lucide アイコン初期化
    lucide.createIcons();

    // データ読み込み
    function loadBallData() {
      try {
        const s = localStorage.getItem('ball_sports_data');
        return s ? JSON.parse(s) : null;
      } catch { return null; }
    }
    function loadTeamData() {
      try {
        const s = localStorage.getItem('team_events_data');
        return s ? JSON.parse(s) : null;
      } catch { return null; }
    }

    function updateOverview() {
      // 球技日
      const ballData = loadBallData();
      if (ballData && ballData.matches) {
        const running = ballData.matches.find(m => m.status === 'running');
        const next = ballData.matches
          .filter(m => ['future', 'pending'].includes(m.status))
          .sort((a, b) => a.time.localeCompare(b.time))[0];
        
        document.getElementById('ballNowRunning').textContent = 
          running ? `${running.name}（${running.venue}）` : 'なし';
        document.getElementById('ballNextMatch').textContent = 
          next ? `${next.time} ${next.name}` : '予定なし';
      }

      // 団体競技日
      const teamData = loadTeamData();
      if (teamData && teamData.events) {
        const running = teamData.events.find(e => ['running', 'delay'].includes(e.status));
        const next = teamData.events
          .filter(e => ['wait', 'ready'].includes(e.status))
          .sort((a, b) => a.time.localeCompare(b.time))[0];
        
        document.getElementById('teamNowRunning').textContent = 
          running ? running.name : 'なし';
        document.getElementById('teamNextEvent').textContent = 
          next ? `${next.time} ${next.name}` : '予定なし';
      }
    }

    // 初期更新 + 30秒ごとに更新
    updateOverview();
    setInterval(updateOverview, 30000);
  </script>
</body>
</html>
