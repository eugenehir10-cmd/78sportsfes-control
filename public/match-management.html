<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>試合管理 | 第78回体育祭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 3.75rem;
      padding: 0 1rem;
      border-bottom: 1px solid #334155;
      color: #f8fafc;
      background: #0f172a;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #7dd3fc;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { color: #bae6fd; }
    h1 { margin: 0; font-size: 0.95rem; }
    nav { display: flex; align-items: center; gap: 1rem; margin-left: auto; }
    nav a { padding: 0.45rem 0.65rem; border: 1px solid #334155; border-radius: 0.45rem; }
    nav a.active { border-color: #0ea5e9; color: #fff; background: rgba(14,165,233,0.16); }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 3.75rem);
      min-height: 34rem;
      border: 0;
      background: #f1f5f9;
    }
    @media (max-width: 520px) {
      header { min-height: 3.5rem; gap: 0.5rem; padding: 0 0.65rem; }
      h1 { display: none; }
      nav { gap: 0.4rem; }
      a { font-size: 0.74rem; }
      nav a { padding: 0.4rem 0.5rem; }
      iframe { height: calc(100dvh - 3.5rem); min-height: 32rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="./ball_sports_test2.html" aria-label="進行本部へ戻る"><i data-lucide="arrow-left"></i> 進行本部</a>
    <h1>競技・試合管理</h1>
      <nav aria-label="管理ページ">
        <a href="./match-management.html" class="match-view-link">試合設定</a>
        <a href="./match-management.html#data-tools" class="data-view-link">データ管理</a>
      </nav>
  </header>
  <iframe id="managementFrame" title="競技・試合の作成と時間設定" src="./ball_sports_test2.html#match-tools"></iframe>
  <script>
    const managementFrame = document.getElementById("managementFrame");
    const updateManagementView = () => {
      const dataView = location.hash === "#data-tools";
      managementFrame.src = dataView
        ? "./ball_sports_test2.html#data-tools"
        : "./ball_sports_test2.html#match-tools";
      document.querySelector(".match-view-link")?.classList.toggle("active", !dataView);
      document.querySelector(".data-view-link")?.classList.toggle("active", dataView);
    };
    window.addEventListener("hashchange", updateManagementView);
    updateManagementView();
    window.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
</body>
</html>
