<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>球技日 タイムテーブル｜スポーツフェスタ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    body {
      background: radial-gradient(ellipse at top, rgba(255,255,255,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(255,255,255,0.03) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a0a 0%, #141414 50%, #0a0a0a 100%);
      min-height: 100vh;
    }
    .card {
      background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(20,20,20,0.95));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 120px rgba(255,255,255,0.02), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .sub-card {
      background: linear-gradient(145deg, rgba(40,40,40,0.7), rgba(25,25,25,0.9));
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.3s ease;
    }
    .sub-card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .status-running { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(5,150,105,0.1)); border-left: 4px solid #10b981; }
    .status-pending { background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.08)); border-left: 4px solid #f59e0b; }
    .status-done { background: linear-gradient(135deg, rgba(75,85,99,0.2), rgba(55,65,81,0.1)); border-left: 4px solid #6b7280; opacity: 0.85; }
    .status-future { background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(37,99,235,0.06)); border-left: 4px solid #3b82f6; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); transition: all 0.3s ease; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.25); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); transition: all 0.3s ease; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16,185,129,0.25); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); transition: all 0.3s ease; }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(239,68,68,0.25); }
    .glow-text { text-shadow: 0 0 40px rgba(255,255,255,0.12), 0 0 80px rgba(255,255,255,0.05); }
    .divider { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); height: 1px; }
    .scroll-h { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
    .scroll-h::-webkit-scrollbar { height: 8px; }
    .scroll-h::-webkit-scrollbar-track { background: transparent; }
    .scroll-h::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    input, select, textarea { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; font-size: 16px !important; }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.3); }
    select option { background: #1a1a1a; color: white; }
    .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .rank-1 { background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(217,119,6,0.1)); border-left: 3px solid #fbbf24; }
    .rank-2 { background: linear-gradient(135deg, rgba(156,163,175,0.2), rgba(107,114,128,0.1)); border-left: 3px solid #9ca3af; }
    .rank-3 { background: linear-gradient(135deg, rgba(180,83,9,0.2), rgba(146,64,14,0.1)); border-left: 3px solid #b45309; }
    .tab-btn { transition: all 0.2s ease; }
    .tab-btn.active { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    .tab-btn:not(.active):hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body class="text-white min-h-screen">
  <!-- ヘッダー -->
  <header class="sticky top-0 z-20 backdrop-blur-xl bg-black/40 border-b border-white/5">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-3">
      <a href="timetable.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="hidden sm:inline">進行管理に戻る</span>
        <span class="sm:hidden">戻る</span>
      </a>
      <h1 class="text-lg md:text-xl font-bold tracking-tight flex items-center gap-2">
        <i data-lucide="trophy" class="w-5 h-5 text-blue-400"></i>
        ⚽ 球技日 タイムテーブル
      </h1>
      <div class="flex gap-2">
        <button id="openSettingsBtn" class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/15 transition-colors text-sm flex items-center gap-1.5">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span class="hidden sm:inline">設定</span>
        </button>
        <button id="exportBtn" class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/15 transition-colors text-sm flex items-center gap-1.5">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span class="hidden sm:inline">出力</span>
        </button>
        <button id="addMatchBtn" class="btn-primary px-4 py-2 rounded-lg text-white font-medium text-sm flex items-center gap-1.5">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">試合追加</span>
          <span class="sm:hidden">追加</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 md:py-12">
    <!-- 全体状況 -->
    <div class="card rounded-3xl p-6 md:p-8 mb-8 fade-in-up">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-2 h-2 rounded-full bg-blue-500 pulse-dot"></div>
        <p class="text-gray-400 text-xs tracking-[0.25em] uppercase">全体状況</p>
      </div>
      <div class="grid gap-4 md:grid-cols-4">
        <div class="sub-card rounded-2xl p-4">
          <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">進行中</p>
          <p id="nowRunning" class="text-xl font-bold text-emerald-400">なし</p>
        </div>
        <div class="sub-card rounded-2xl p-4">
          <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">時間調整</p>
          <p id="timeAdjust" class="text-xl font-bold font-mono-num">±0分</p>
        </div>
        <div class="sub-card rounded-2xl p-4">
          <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">試合消化</p>
          <p id="matchProgress" class="text-xl font-bold">0 / 0</p>
        </div>
        <div class="sub-card rounded-2xl p-4">
          <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">会場数</p>
          <p id="venueCount" class="text-xl font-bold text-blue-400">0</p>
        </div>
      </div>
      <div class="mt-5 pt-5 border-t border-white/5 flex flex-wrap gap-3 items-center">
        <label class="text-sm text-gray-400">⏱️ 全体時間調整：</label>
        <input type="number" id="globalDelay" value="0" class="w-24 rounded-lg px-3 py-2 text-center" placeholder="分">
        <span class="text-sm text-gray-500">分</span>
        <button id="applyDelayBtn" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/15 transition-colors text-sm">適用</button>
        <button id="resetDelayBtn" class="px-4 py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors text-sm">リセット</button>
      </div>
    </div>

    <!-- フィルター -->
    <div class="card rounded-2xl p-4 mb-6 fade-in-up delay-1 flex flex-wrap gap-3 items-center">
      <span class="text-sm text-gray-400">絞り込み：</span>
      <select id="filterGrade" class="rounded-lg px-3 py-2 text-sm">
        <option value="">全学年</option>
      </select>
      <select id="filterSport" class="rounded-lg px-3 py-2 text-sm">
        <option value="">全競技種別</option>
        <option value="サッカー">サッカー</option>
        <option value="野球">野球</option>
        <option value="バスケットボール">バスケットボール</option>
        <option value="バレーボール">バレーボール</option>
        <option value="ドッジボール">ドッジボール</option>
        <option value="アルティメット">アルティメット</option>
        <option value="卓球">卓球</option>
      </select>
      <p class="text-xs text-gray-500 ml-auto">※ 設定から学年・競技種別を管理できます</p>
    </div>

    <!-- 会場管理 -->
    <div class="card rounded-2xl p-5 mb-6 fade-in-up delay-1">
      <h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
        <i data-lucide="map-pin" class="w-4 h-4"></i>
        会場管理
      </h3>
      <div class="flex gap-2 flex-wrap">
        <input type="text" id="newVenueName" placeholder="会場名（例：Aコート）" class="flex-1 min-w-[140px] rounded-lg px-3 py-2.5">
        <button id="addVenueBtn" class="btn-primary px-4 py-2.5 rounded-lg font-medium whitespace-nowrap">会場追加</button>
      </div>
    </div>

    <!-- タイムテーブル本体 -->
    <div class="fade-in-up delay-2">
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <i data-lucide="calendar-clock" class="w-5 h-5 text-gray-400"></i>
        タイムテーブル
      </h2>
      <div class="scroll-h pb-6">
        <div id="timetableGrid" class="flex gap-4 align-start min-w-max"></div>
      </div>
    </div>

    <!-- チーム別得点ランキング -->
    <div class="card rounded-3xl p-6 md:p-8 mt-8 fade-in-up delay-3">
      <h2 class="text-lg font-semibold mb-5 flex items-center gap-2">
        <i data-lucide="bar-chart-3" class="w-5 h-5 text-amber-400"></i>
        チーム別勝ち点ランキング
      </h2>
      <div class="grid gap-4 md:grid-cols-2 mb-5">
        <div>
          <h3 class="text-sm text-gray-400 mb-3">勝ち点設定</h3>
          <div class="flex gap-3 flex-wrap text-sm">
            <label class="flex items-center gap-2"><span class="text-gray-400">勝利：</span><input type="number" id="pointWin" value="3" class="w-16 rounded-lg px-2 py-1.5 text-center"><span class="text-gray-500">pt</span></label>
            <label class="flex items-center gap-2"><span class="text-gray-400">引分：</span><input type="number" id="pointDraw" value="1" class="w-16 rounded-lg px-2 py-1.5 text-center"><span class="text-gray-500">pt</span></label>
            <label class="flex items-center gap-2"><span class="text-gray-400">敗北：</span><input type="number" id="pointLose" value="0" class="w-16 rounded-lg px-2 py-1.5 text-center"><span class="text-gray-500">pt</span></label>
            <button id="calcRankingBtn" class="btn-success px-3 py-1.5 rounded-lg text-sm">再計算</button>
          </div>
        </div>
      </div>
      <div id="rankingList" class="space-y-2"></div>
    </div>
  </main>

  <!-- 編集モーダル -->
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="card rounded-3xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-xl font-bold mb-6 flex items-center gap-2">
        <i data-lucide="edit-3" class="w-5 h-5 text-blue-400"></i>
        試合情報
      </h3>
      <form id="matchForm" class="space-y-4">
        <input type="hidden" id="editMatchId">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">会場 *</label>
            <select id="editVenue" class="w-full rounded-xl px-4 py-3" required></select>
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">開始時刻 *</label>
            <input type="time" id="editTime" class="w-full rounded-xl px-4 py-3" required>
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">競技種別</label>
          <select id="editSport" class="w-full rounded-xl px-4 py-3">
            <option value="サッカー">サッカー</option>
            <option value="野球">野球</option>
            <option value="バスケットボール">バスケットボール</option>
            <option value="バレーボール">バレーボール</option>
            <option value="ドッジボール">ドッジボール</option>
            <option value="アルティメット">アルティメット</option>
            <option value="卓球">卓球</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">対象学年</label>
          <select id="editGrade" class="w-full rounded-xl px-4 py-3">
            <option value="">指定なし</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">チームA *</label>
            <select id="editTeamA" class="w-full rounded-xl px-4 py-3" required></select>
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">チームB *</label>
            <select id="editTeamB" class="w-full rounded-xl px-4 py-3" required></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">得点A</label>
            <input type="number" id="editScoreA" value="0" min="0" class="w-full rounded-xl px-4 py-3 text-center font-mono-num text-xl">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">得点B</label>
            <input type="number" id="editScoreB" value="0" min="0" class="w-full rounded-xl px-4 py-3 text-center font-mono-num text-xl">
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">状況</label>
          <select id="editStatus" class="w-full rounded-xl px-4 py-3">
            <option value="future">まもなく</option>
            <option value="pending">準備中</option>
            <option value="running">🔥 進行中</option>
            <option value="done">✅ 終了</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">備考</label>
          <textarea id="editNote" rows="2" placeholder="連絡事項など" class="w-full rounded-xl px-4 py-3"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" id="modalClose" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/15 transition-colors font-medium">キャンセル</button>
          <button type="button" id="modalDelete" class="px-4 py-3 rounded-xl btn-danger font-medium hidden">削除</button>
          <button type="submit" class="flex-1 py-3 rounded-xl btn-primary font-medium">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="card rounded-3xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold mb-6 flex items-center gap-2">
        <i data-lucide="settings" class="w-5 h-5 text-gray-400"></i>
        設定
      </h3>
      <div id="settingsPasswordArea" class="space-y-4">
        <p class="text-sm text-gray-400">設定を変更するにはパスワードが必要です</p>
        <input type="password" id="settingsPassword" placeholder="パスワード" class="w-full rounded-xl px-4 py-3">
        <button id="authSettingsBtn" class="w-full py-3 rounded-xl btn-primary font-medium">認証</button>
      </div>
      <div id="settingsContent" class="hidden space-y-6">
        <div>
          <h4 class="text-sm font-semibold text-gray-300 mb-3">📋 競技種別 一括追加</h4>
          <button id="addDefaultSportsBtn" class="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 transition-colors text-sm">デフォルト競技種別を追加</button>
        </div>
        <div class="pt-4 border-t border-white/5 space-y-3">
          <button id="resetBallBtn" class="w-full py-3 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors text-sm flex items-center justify-center gap-2">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            球技日データのみ初期化
          </button>
        </div>
      </div>
      <button id="closeSettingsBtn" class="w-full mt-6 py-3 rounded-xl bg-white/10 hover:bg-white/15 transition-colors font-medium">閉じる</button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const SETTINGS_PASSWORD = 'admin123';

    // 共通設定読み込み
    function loadCommon() {
      try { const s = localStorage.getItem('common_settings'); return s ? JSON.parse(s) : { classes: [], grades: ['1年生', '2年生', '3年生'] }; }
      catch { return { classes: [], grades: ['1年生', '2年生', '3年生'] }; }
    }
    let common = loadCommon();

    // 球技日データ
    let data = {
      venues: ['Aコート', 'Bコート', 'Cコート'],
      matches: [
        { id: 1, venue: 'Aコート', time: '09:00', sport: 'サッカー', grade: '1年生', teamA: '1年A組', teamB: '1年B組', scoreA: 2, scoreB: 0, status: 'done', note: '' },
        { id: 2, venue: 'Bコート', time: '09:00', sport: 'バスケットボール', grade: '2年生', teamA: '2年A組', teamB: '2年B組', scoreA: 1, scoreB: 1, status: 'done', note: '' },
        { id: 3, venue: 'Cコート', time: '09:30', sport: 'サッカー', grade: '1年生', teamA: '1年A組', teamB: '1年C組', scoreA: 1, scoreB: 0, status: 'running', note: '前半終了' },
        { id: 4, venue: 'Aコート', time: '10:00', sport: 'バレーボール', grade: '3年生', teamA: '3年A組', teamB: '3年B組', scoreA: 0, scoreB: 0, status: 'future', note: '' },
      ],
      globalDelay: 0,
      points: { win: 3, draw: 1, lose: 0 }
    };

    function saveData() { localStorage.setItem('ball_sports_data_v2', JSON.stringify(data)); }
    function loadData() {
      const s = localStorage.getItem('ball_sports_data_v2');
      if (s) try { data = Object.assign(data, JSON.parse(s)); } catch {}
    }

    function applyDelay(time) {
      if (!data.globalDelay) return time;
      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + data.globalDelay;
      const nh = Math.floor((total % 1440 + 1440) % 1440 / 60);
      const nm = ((total % 60) + 60) % 60;
      return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
    }
    function getStatusStyle(s) { return { running: 'status-running', pending: 'status-pending', done: 'status-done', future: 'status-future' }[s] || 'status-future'; }
    function getStatusLabel(s) { return { future: 'まもなく', pending: '準備中', running: '🔥 進行中', done: '✅ 終了' }[s] || s; }

    function updateFilterOptions() {
      const gradeSel = document.getElementById('filterGrade');
      const editGrade = document.getElementById('editGrade');
      const teamA = document.getElementById('editTeamA');
      const teamB = document.getElementById('editTeamB');
      const venueSel = document.getElementById('editVenue');
      
      gradeSel.innerHTML = '<option value="">全学年</option>' + common.grades.map(g => `<option value="${g}">${g}</option>`).join('');
      editGrade.innerHTML = '<option value="">指定なし</option>' + common.grades.map(g => `<option value="${g}">${g}</option>`).join('');
      const classOpt = common.classes.map(c => `<option value="${c}">${c}</option>`).join('');
      teamA.innerHTML = classOpt; teamB.innerHTML = classOpt;
      venueSel.innerHTML = data.venues.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function render() {
      updateFilterOptions();
      const fGrade = document.getElementById('filterGrade')?.value;
      const fSport = document.getElementById('filterSport')?.value;
      
      const grid = document.getElementById('timetableGrid');
      grid.innerHTML = '';
      
      data.venues.forEach(venue => {
        let matches = data.matches.filter(m => m.venue === venue).sort((a,b) => a.time.localeCompare(b.time));
        if (fGrade) matches = matches.filter(m => m.grade === fGrade);
        if (fSport) matches = matches.filter(m => m.sport === fSport);
        
        const canDel = matches.length === 0;
        grid.innerHTML += `
          <div class="flex-shrink-0" style="min-width: 300px;">
            <div class="flex items-center justify-between mb-3 px-1">
              <h2 class="font-bold text-lg flex items-center gap-2">
                <i data-lucide="map-pin" class="w-4 h-4 text-blue-400"></i>${venue}
              </h2>
              <button data-del-venue="${venue}" class="text-red-400 hover:text-red-600 text-sm px-2 py-1 rounded hover:bg-red-500/10 transition-colors ${!canDel?'opacity-30 cursor-not-allowed':''}" ${!canDel?'disabled':''}>×</button>
            </div>
            <div class="space-y-3">
              ${matches.length ? matches.map(m => `
                <div class="sub-card rounded-2xl p-4 cursor-pointer ${getStatusStyle(m.status)}" data-edit-id="${m.id}">
                  <div class="flex justify-between items-start mb-2">
                    <div class="flex items-center gap-2">
                      <span class="font-mono-num font-bold text-lg">${applyDelay(m.time)}</span>
                      ${m.grade ? `<span class="text-xs px-2 py-0.5 rounded-full bg-white/10">${m.grade}</span>` : ''}
                      ${m.sport ? `<span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300">${m.sport}</span>` : ''}
                    </div>
                    <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-white/10 backdrop-blur">${getStatusLabel(m.status)}</span>
                  </div>
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="font-semibold flex-1 text-right">${m.teamA}</span>
                    <span class="font-mono-num font-bold text-lg px-3">
                      ${m.status === 'done' || m.status === 'running' ? `${m.scoreA} - ${m.scoreB}` : 'VS'}
                    </span>
                    <span class="font-semibold flex-1">${m.teamB}</span>
                  </div>
                  ${m.note?`<p class="text-xs text-gray-400 mt-1">📝 ${m.note}</p>`:''}
                </div>
              `).join('') : '<p class="text-gray-500 text-sm px-2 py-4 text-center bg-white/5 rounded-xl border border-dashed border-white/10">該当試合なし</p>'}
            </div>
          </div>
        `;
      });
      bindGridEvents();
      updateOverview();
      calcRanking();
      lucide.createIcons();
    }

    function updateOverview() {
      const running = data.matches.find(m => m.status === 'running');
      const doneCount = data.matches.filter(m => m.status === 'done').length;
      document.getElementById('nowRunning').textContent = running ? `${running.teamA} VS ${running.teamB}` : 'なし';
      document.getElementById('timeAdjust').textContent = `${data.globalDelay >= 0 ? '+' : ''}${data.globalDelay}分`;
      document.getElementById('timeAdjust').className = `text-xl font-bold font-mono-num ${data.globalDelay > 0 ? 'text-amber-400' : data.globalDelay < 0 ? 'text-blue-400' : 'text-white'}`;
      document.getElementById('matchProgress').textContent = `${doneCount} / ${data.matches.length}`;
      document.getElementById('venueCount').textContent = data.venues.length;
      document.getElementById('globalDelay').value = data.globalDelay;
    }

    function calcRanking() {
      const points = {
        win: Number(document.getElementById('pointWin')?.value || data.points.win),
        draw: Number(document.getElementById('pointDraw')?.value || data.points.draw),
        lose: Number(document.getElementById('pointLose')?.value || data.points.lose)
      };
      data.points = points;
      
      const teams = {};
      common.classes.forEach(c => teams[c] = { name: c, win: 0, draw: 0, lose: 0, score: 0, conceded: 0, point: 0 });
      
      data.matches.filter(m => m.status === 'done').forEach(m => {
        [m.teamA, m.teamB].forEach(t => { if (!teams[t]) teams[t] = { name: t, win: 0, draw: 0, lose: 0, score: 0, conceded: 0, point: 0 }; });
        const ta = teams[m.teamA], tb = teams[m.teamB];
        if (!ta || !tb) return;
        ta.score += m.scoreA; ta.conceded += m.scoreB;
        tb.score += m.scoreB; tb.conceded += m.scoreA;
        if (m.scoreA > m.scoreB) { ta.win++; ta.point += points.win; tb.lose++; tb.point += points.lose; }
        else if (m.scoreA < m.scoreB) { tb.win++; tb.point += points.win; ta.lose++; ta.point += points.lose; }
        else { ta.draw++; tb.draw++; ta.point += points.draw; tb.point += points.draw; }
      });
      
      const ranking = Object.values(teams).filter(t => t.win + t.draw + t.lose > 0 || common.classes.includes(t.name))
        .sort((a, b) => b.point !== a.point ? b.point - a.point : (b.score - b.conceded) - (a.score - a.conceded));
      
      const listEl = document.getElementById('rankingList');
      if (!ranking.length) { listEl.innerHTML = '<p class="text-gray-500 text-sm text-center py-6">終了した試合がありません</p>'; return; }
      
      listEl.innerHTML = ranking.map((t, i) => {
        const rc = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'bg-white/5 border border-white/5';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}位`;
        return `
          <div class="sub-card ${rc} rounded-xl p-4 flex items-center gap-4">
            <div class="w-12 text-center font-bold text-lg">${medal}</div>
            <div class="flex-1 min-w-0">
              <p class="font-semibold">${t.name}</p>
              <p class="text-xs text-gray-400">${t.win}勝 ${t.draw}分 ${t.lose}敗 | 得失差 ${t.score - t.conceded >= 0 ? '+' : ''}${t.score - t.conceded}</p>
            </div>
            <div class="text-right">
              <p class="font-mono-num font-bold text-2xl">${t.point}</p>
              <p class="text-xs text-gray-500">pt</p>
            </div>
          </div>
        `;
      }).join('');
      saveData();
    }

    function bindGridEvents() {
      document.querySelectorAll('[data-edit-id]').forEach(el => el.addEventListener('click', () => openEdit(Number(el.dataset.editId))));
      document.querySelectorAll('[data-del-venue]').forEach(el => el.addEventListener('click', () => {
        if (el.disabled) return;
        if (!confirm(`「${el.dataset.delVenue}」を削除しますか？`)) return;
        data.venues = data.venues.filter(v => v !== el.dataset.delVenue);
        saveData(); render();
      }));
    }

    function openEdit(id) {
      const m = data.matches.find(x => x.id === id);
      if (!m) return;
      updateFilterOptions();
      document.getElementById('modalTitle').textContent = '試合を編集';
      document.getElementById('editMatchId').value = id;
      document.getElementById('editVenue').value = m.venue;
      document.getElementById('editTime').value = m.time;
      document.getElementById('editSport').value = m.sport || 'サッカー';
      document.getElementById('editGrade').value = m.grade || '';
      document.getElementById('editTeamA').value = m.teamA;
      document.getElementById('editTeamB').value = m.teamB;
      document.getElementById('editScoreA').value = m.scoreA;
      document.getElementById('editScoreB').value = m.scoreB;
      document.getElementById('editStatus').value = m.status;
      document.getElementById('editNote').value = m.note || '';
      document.getElementById('modalDelete').classList.remove('hidden');
      document.getElementById('editModal').classList.remove('hidden');
    }

    function openAdd() {
      updateFilterOptions();
      document.getElementById('modalTitle').textContent = '試合を追加';
      document.getElementById('editMatchId').value = '';
      document.getElementById('editTime').value = '';
      document.getElementById('editSport').value = 'サッカー';
      document.getElementById('editGrade').value = '';
      document.getElementById('editScoreA').value = 0;
      document.getElementById('editScoreB').value = 0;
      document.getElementById('editStatus').value = 'future';
      document.getElementById('editNote').value = '';
      document.getElementById('modalDelete').classList.add('hidden');
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('editModal').classList.add('hidden'); }

    // イベント
    document.getElementById('addVenueBtn').addEventListener('click', () => {
      const v = document.getElementById('newVenueName').value.trim();
      if (!v || data.venues.includes(v)) return alert('入力が空または既に存在します');
      data.venues.push(v); saveData(); render();
      document.getElementById('newVenueName').value = '';
    });
    document.getElementById('addMatchBtn').addEventListener('click', openAdd);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('editModal').addEventListener('click', e => { if (e.target.id === 'editModal') closeModal(); });
    document.getElementById('modalDelete').addEventListener('click', () => {
      const id = Number(document.getElementById('editMatchId').value);
      if (!confirm('この試合を削除しますか？')) return;
      data.matches = data.matches.filter(m => m.id !== id);
      saveData(); render(); closeModal();
    });
    document.getElementById('matchForm').addEventListener('submit', e => {
      e.preventDefault();
      const idVal = document.getElementById('editMatchId').value;
      const venue = document.getElementById('editVenue').value;
      const time = document.getElementById('editTime').value;
      const sport = document.getElementById('editSport').value;
      const grade = document.getElementById('editGrade').value;
      const teamA = document.getElementById('editTeamA').value;
      const teamB = document.getElementById('editTeamB').value;
      const scoreA = Number(document.getElementById('editScoreA').value) || 0;
      const scoreB = Number(document.getElementById('editScoreB').value) || 0;
      const status = document.getElementById('editStatus').value;
      const note = document.getElementById('editNote').value.trim();
      if (!teamA || !teamB || !time || !venue) return alert('必須項目を入力してください');
      if (idVal) {
        const m = data.matches.find(x => x.id === Number(idVal));
        Object.assign(m, { venue, time, sport, grade, teamA, teamB, scoreA, scoreB, status, note });
      } else {
        const newId = data.matches.length ? Math.max(...data.matches.map(x=>x.id))+1 : 1;
        data.matches.push({ id: newId, venue, time, sport, grade, teamA, teamB, scoreA, scoreB, status, note });
      }
      saveData(); render(); closeModal();
    });
    document.getElementById('applyDelayBtn').addEventListener('click', () => {
      data.globalDelay = Number(document.getElementById('globalDelay').value) || 0;
      saveData(); render();
    });
    document.getElementById('resetDelayBtn').addEventListener('click', () => { data.globalDelay = 0; saveData(); render(); });
    document.getElementById('calcRankingBtn').addEventListener('click', calcRanking);
    ['pointWin', 'pointDraw', 'pointLose'].forEach(id => {
      document.getElementById(id).value = data.points[id.replace('point', '').toLowerCase()];
      document.getElementById(id)?.addEventListener('change', calcRanking);
    });
    document.getElementById('filterGrade')?.addEventListener('change', render);
    document.getElementById('filterSport')?.addEventListener('change', render);
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `ball_sports_${new Date().toISOString().slice(0,10)}.json`;
      a.click(); URL.revokeObjectURL(url);
    });

    // 設定モーダル
    document.getElementById('openSettingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('settingsModal').classList.add('flex');
    });
    document.getElementById('closeSettingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.add('hidden');
      document.getElementById('settingsModal').classList.remove('flex');
      document.getElementById('settingsPasswordArea').classList.remove('hidden');
      document.getElementById('settingsContent').classList.add('hidden');
      document.getElementById('settingsPassword').value = '';
    });
    document.getElementById('settingsModal').addEventListener('click', e => { if (e.target.id === 'settingsModal') document.getElementById('closeSettingsBtn').click(); });
    document.getElementById('authSettingsBtn').addEventListener('click', () => {
      if (document.getElementById('settingsPassword').value === SETTINGS_PASSWORD) {
        document.getElementById('settingsPasswordArea').classList.add('hidden');
        document.getElementById('settingsContent').classList.remove('hidden');
      } else { alert('パスワードが違います'); }
    });
    document.getElementById('resetBallBtn').addEventListener('click', () => {
      if (!confirm('球技日のデータを初期化しますか？')) return;
      localStorage.removeItem('ball_sports_data_v2');
      location.reload();
    });

    // 初期化
    loadData(); render();
  </script>
</body>
</html>
