<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>球技日 タイムテーブル｜スポーツフェスタ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    body {
      background: radial-gradient(ellipse at top, rgba(255,255,255,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(255,255,255,0.03) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a0a 0%, #141414 50%, #0a0a0a 100%);
      min-height: 100vh;
    }
    .card {
      background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(20,20,20,0.95));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 120px rgba(255,255,255,0.02), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .sub-card {
      background: linear-gradient(145deg, rgba(40,40,40,0.7), rgba(25,25,25,0.9));
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
    }
    .sub-card:active { transform: scale(0.985); }
    .status-running { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(5,150,105,0.08)); border-left: 4px solid #10b981; }
    .status-pending { background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.08)); border-left: 4px solid #f59e0b; }
    .status-done { background: linear-gradient(135deg, rgba(75,85,99,0.2), rgba(55,65,81,0.1)); border-left: 4px solid #6b7280; opacity: 0.85; }
    .status-future { background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(37,99,235,0.06)); border-left: 4px solid #3b82f6; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); transition: all 0.2s ease; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .scroll-h { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .scroll-h::-webkit-scrollbar { height: 6px; }
    .scroll-h::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    input, select, textarea {
      background: rgba(255,255,255,0.05) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      color: white !important;
      font-size: 16px !important;
      min-height: 44px;
    }
    input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
    select option { background: #1a1a1a; color: white; }
    .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .rank-1 { background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(217,119,6,0.1)); border-left: 3px solid #fbbf24; }
    .rank-2 { background: linear-gradient(135deg, rgba(156,163,175,0.2), rgba(107,114,128,0.1)); border-left: 3px solid #9ca3af; }
    .rank-3 { background: linear-gradient(135deg, rgba(180,83,9,0.2), rgba(146,64,14,0.1)); border-left: 3px solid #b45309; }
    .rank-4 { background: linear-gradient(135deg, rgba(75,85,99,0.15), rgba(55,65,81,0.08)); border-left: 3px solid #4b5563; }
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse-dot { animation: pulse-soft 1.2s ease-in-out infinite; }
    .venue-status-card { transition: all 0.2s ease; }
    .venue-status-card:active { transform: scale(0.97); }
    .group-select { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .group-btn {
      padding: 14px 8px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); cursor: pointer; transition: all 0.15s ease;
      font-weight: 700; text-align: center; font-size: 18px;
      min-height: 52px;
    }
    .group-btn:active:not(:disabled) { transform: scale(0.92); }
    .group-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .group-btn.sel-1 { border-color: #fbbf24; background: rgba(251,191,36,0.2); color: #fbbf24; }
    .group-btn.sel-2 { border-color: #9ca3af; background: rgba(156,163,175,0.2); color: #e5e7eb; }
    .group-btn.sel-3 { border-color: #b45309; background: rgba(180,83,9,0.2); color: #fbbf24; }
    .group-btn.sel-4 { border-color: #4b5563; background: rgba(75,85,99,0.2); color: #9ca3af; }
    .sync-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 4px 8px; border-radius: 9999px; }
    .sync-online { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .sync-offline { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .sync-syncing { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
    .auth-badge-authed { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .auth-badge-guest { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .locked-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; color: #ef4444;
    }
    .delay-chain-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 9999px; font-weight: 600; white-space: nowrap;
    }
    .delay-chain-plus { background: rgba(245,158,11,0.2); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .delay-chain-minus { background: rgba(6,182,212,0.2); color: #06b6d4; border: 1px solid rgba(6,182,212,0.3); }
    .delay-chain-zero { background: rgba(255,255,255,0.08); color: #9ca3af; border: 1px solid rgba(255,255,255,0.15); }
    .google-btn {
      background: white !important; color: #444 !important;
      display: inline-flex; align-items: center; gap: 8px; font-weight: 500;
      border: 1px solid rgba(0,0,0,0.1) !important; min-height: 44px;
    }
    .google-btn:active { background: #f0f0f0 !important; transform: scale(0.98); }
    header a, header button { min-height: 40px; }
    @media (max-width: 640px) {
      #editModal { padding: 0 !important; }
      #editModal .card {
        margin: 0; border-radius: 20px 20px 0 0;
        max-height: 90vh; height: 90vh;
        position: fixed; bottom: 0; left: 0; right: 0;
      }
      .filter-row { flex-direction: column; align-items: stretch !important; }
      .filter-row select { width: 100% !important; }
    }
  </style>
</head>
<body class="text-white min-h-screen">
  <header class="sticky top-0 z-20 backdrop-blur-xl bg-black/60 border-b border-white/5">
    <div class="max-w-7xl mx-auto px-3 py-3 flex justify-between items-center gap-2">
      <a href="timetable.html" class="inline-flex items-center gap-1.5 text-gray-400 hover:text-white transition-colors px-2 py-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="text-sm">戻る</span>
      </a>
      <h1 class="text-base md:text-lg font-bold flex items-center gap-1.5">
        <i data-lucide="trophy" class="w-4.5 h-4.5 text-blue-400"></i>⚽ 球技日
      </h1>
      <div class="flex items-center gap-1.5">
        <span id="syncStatus" class="sync-status sync-syncing">
          <span class="w-1.5 h-1.5 rounded-full bg-current pulse-dot"></span>
          <span class="hidden sm:inline text-xs" id="syncStatusText">接続中</span>
        </span>
        <span id="authBadge" class="sync-status auth-badge-guest hidden sm:inline-flex">
          <i data-lucide="lock" class="w-3 h-3"></i>
          <span id="authStatusText">未認証</span>
        </span>
      </div>
      <div class="flex gap-1.5">
        <button id="authBtn" class="px-2.5 py-2 rounded-lg bg-white hover:bg-gray-100 text-gray-800 transition-colors text-xs flex items-center gap-1.5 google-btn">
          <svg width="15" height="15" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 35.5 24 35.5c-6.4 0-11.5-5.1-11.5-11.5S17.6 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.9 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c10 0 18.4-7.4 19.6-17.1.3-.9.4-1.8.4-2.7 0-.9-.1-1.8-.4-2.7z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.8 16 19 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.9 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.3-7.2 2.3-5.3 0-9.7-3-11.3-7.3l-6.5 5C9.5 38.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2c.4-.4 7.7-5.6 7.7-14.9 0-.9-.1-1.8-.4-2.7z"/></svg>
          <span class="hidden sm:inline" id="authBtnText">ログイン</span>
        </button>
        <button id="manualSyncBtn" class="px-2.5 py-2 rounded-lg bg-white/10 hover:bg-white/15 transition-colors text-sm" title="同期">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <button id="exportBtn" class="px-2.5 py-2 rounded-lg bg-white/10 hover:bg-white/15 transition-colors text-sm" title="出力">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-3 py-4 md:py-8">
    <div class="card rounded-2xl p-4 md:p-6 mb-6 fade-in-up">
      <div class="flex items-center gap-2 mb-4">
        <div class="w-2 h-2 rounded-full bg-blue-500 pulse-dot"></div>
        <p class="text-gray-400 text-xs tracking-wider uppercase">各コート状況</p>
      </div>
      <div id="venueStatusGrid" class="grid gap-3 grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 mb-4"></div>
      <p class="text-xs text-gray-500 pt-3 border-t border-white/5">📌 試合をタップ → 編集・結果入力</p>
    </div>
    <div class="card rounded-2xl p-3 mb-4 fade-in-up delay-1">
      <div class="filter-row flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
        <span class="text-sm text-gray-400 whitespace-nowrap">絞り込み：</span>
        <select id="filterGrade" class="rounded-lg px-3 py-2 text-sm flex-1">
          <option value="">全学年</option>
          <option value="中学1年">中学1年</option><option value="中学2年">中学2年</option><option value="中学3年">中学3年</option>
          <option value="高校1年">高校1年</option><option value="高校2年">高校2年</option><option value="高校3年">高校3年</option>
        </select>
        <select id="filterSport" class="rounded-lg px-3 py-2 text-sm flex-1">
          <option value="">全競技</option>
          <option value="サッカー">サッカー</option><option value="野球">野球</option><option value="バスケットボール">バスケットボール</option>
          <option value="バレーボール">バレーボール</option><option value="ドッジボール">ドッジボール</option>
          <option value="アルティメット">アルティメット</option><option value="卓球">卓球</option>
        </select>
        <p class="text-xs text-gray-500 sm:ml-auto">※ 追加は設定画面から</p>
      </div>
    </div>
    <div class="fade-in-up delay-2">
      <h2 class="text-base font-semibold mb-3 flex items-center gap-2">
        <i data-lucide="calendar-clock" class="w-4.5 h-4.5 text-gray-400"></i>タイムテーブル
      </h2>
      <div class="scroll-h pb-4 -mx-3 px-3">
        <div id="timetableGrid" class="flex gap-3 align-start min-w-max"></div>
      </div>
    </div>
    <div class="card rounded-2xl p-4 md:p-6 mt-6 fade-in-up delay-2">
      <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
        <i data-lucide="bar-chart-3" class="w-4.5 h-4.5 text-amber-400"></i>🏆 組別得点ランキング
      </h2>
      <div id="rankingList" class="space-y-2.5"></div>
      <p class="text-xs text-gray-500 mt-3 text-center">※ 1位150 / 2位100 / 3位50 / 4位0（野球は3位なし）</p>
    </div>
  </main>
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="card rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-lg font-bold mb-1 flex items-center gap-2">
        <i data-lucide="edit-3" class="w-4.5 h-4.5 text-blue-400"></i>試合情報
      </h3>
      <p id="modalSubtitle" class="text-xs text-gray-400 mb-4"></p>
      <form id="matchForm" class="space-y-3.5">
        <input type="hidden" id="editMatchId">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">開始時刻</label>
            <input type="time" id="editTime" class="w-full rounded-xl px-3 py-2.5" required>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">所要時間</label>
            <input type="number" id="editDuration" value="30" min="1" class="w-full rounded-xl px-3 py-2.5 text-center">
          </div>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">⏱️ 遅延時間（後続に伝播）</label>
          <div class="flex items-center gap-2">
            <button type="button" class="adj-btn px-3 py-2.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 font-bold" data-adj="-5">-5</button>
            <button type="button" class="adj-btn px-3 py-2.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 font-bold" data-adj="-1">-1</button>
            <input type="number" id="editDelay" value="0" class="flex-1 rounded-xl px-3 py-2.5 text-center font-mono-num text-lg">
            <button type="button" class="adj-btn px-3 py-2.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 font-bold" data-adj="1">+1</button>
            <button type="button" class="adj-btn px-3 py-2.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 font-bold" data-adj="5">+5</button>
          </div>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">ステータス</label>
          <select id="editStatus" class="w-full rounded-xl px-3 py-2.5">
            <option value="future">まもなく</option><option value="pending">準備中</option>
            <option value="running">🔥 進行中</option><option value="done">✅ 終了</option>
          </select>
        </div>
        <div class="pt-3 border-t border-white/5 relative" id="resultSection">
          <p class="text-sm font-medium text-gray-300 mb-3 flex items-center justify-between">
            <span>🏆 順位入力</span>
            <span id="resultLockBadge" class="text-xs px-2 py-0.5 rounded-full bg-red-500/20 text-red-400">🔒 要ログイン</span>
          </p>
          <div id="resultInputArea" class="space-y-3 relative">
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">🥇 1位（150pt）</label>
              <div class="group-select" data-rank="1">
                <button type="button" class="group-btn" data-g="A" disabled>A</button>
                <button type="button" class="group-btn" data-g="B" disabled>B</button>
                <button type="button" class="group-btn" data-g="C" disabled>C</button>
                <button type="button" class="group-btn" data-g="D" disabled>D</button>
              </div>
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">🥈 2位（100pt）</label>
              <div class="group-select" data-rank="2">
                <button type="button" class="group-btn" data-g="A" disabled>A</button>
                <button type="button" class="group-btn" data-g="B" disabled>B</button>
                <button type="button" class="group-btn" data-g="C" disabled>C</button>
                <button type="button" class="group-btn" data-g="D" disabled>D</button>
              </div>
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">🥉 3位（50pt）</label>
              <div class="group-select" data-rank="3">
                <button type="button" class="group-btn" data-g="A" disabled>A</button>
                <button type="button" class="group-btn" data-g="B" disabled>B</button>
                <button type="button" class="group-btn" data-g="C" disabled>C</button>
                <button type="button" class="group-btn" data-g="D" disabled>D</button>
              </div>
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">4位（0pt）</label>
              <div class="group-select" data-rank="4">
                <button type="button" class="group-btn" data-g="A" disabled>A</button>
                <button type="button" class="group-btn" data-g="B" disabled>B</button>
                <button type="button" class="group-btn" data-g="C" disabled>C</button>
                <button type="button" class="group-btn" data-g="D" disabled>D</button>
              </div>
            </div>
            <div id="lockedOverlay" class="locked-overlay">
              <i data-lucide="lock" class="w-7 h-7 mb-1"></i>
              <p class="text-sm font-medium">ログインして入力</p>
              <button type="button" id="openLoginFromResult" class="mt-2 px-4 py-2 rounded-lg google-btn text-sm font-medium">
                <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 35.5 24 35.5c-6.4 0-11.5-5.1-11.5-11.5S17.6 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.9 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c10 0 18.4-7.4 19.6-17.1.3-.9.4-1.8.4-2.7 0-.9-.1-1.8-.4-2.7z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.8 16 19 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.9 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.3-7.2 2.3-5.3 0-9.7-3-11.3-7.3l-6.5 5C9.5 38.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2c.4-.4 7.7-5.6 7.7-14.9 0-.9-.1-1.8-.4-2.7z"/></svg>
                Googleログイン
              </button>
            </div>
          </div>
          <input type="hidden" id="editRank1" value="">
          <input type="hidden" id="editRank2" value="">
          <input type="hidden" id="editRank3" value="">
          <input type="hidden" id="editRank4" value="">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">備考</label>
          <textarea id="editNote" rows="2" class="w-full rounded-xl px-3 py-2.5"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" id="modalClose" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/15 transition-colors font-medium">キャンセル</button>
          <button type="submit" class="flex-1 py-3 rounded-xl btn-primary font-medium text-white">保存</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    lucide.createIcons();
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCVYfQSmKyPvbDWrAp6FNMUmuu3_GyrM00",
      authDomain: "thsportsfes.firebaseapp.com",

      setStatus(s, text) {

      async save(key, data) {
        localStorage.setItem(key, JSON.stringify(data));
        try {
          this.setStatus('syncing', '同期中');
          await db.collection('app_data').doc(key).set({
            data: JSON.parse(JSON.stringify(data)),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            device: getDeviceInfo()
          });
          this.setStatus('online', 'オンライン');
        } catch (e) {
          console.warn('保存失敗:', e);
          this.setStatus('offline', 'オフライン');
        }
      },
      async load(key, defaultValue) {
        const local = localStorage.getItem(key);
        let localData = local ? JSON.parse(local) : defaultValue;
        try {
          this.setStatus('syncing', '読込中');
          const doc = await db.collection('app_data').doc(key).get();
          if (doc.exists) {
            const remote = doc.data().data;
            localStorage.setItem(key, JSON.stringify(remote));
            this.setStatus('online', 'オンライン');
            return remote;
          } else if (local) {
            await db.collection('app_data').doc(key).set({
              data: JSON.parse(JSON.stringify(localData)),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              device: getDeviceInfo()
            });
          }
        } catch (e) {
          console.warn('読込失敗:', e);
          this.setStatus('offline', 'オフライン');
        }
        return localData;
      },
      subscribe(key, callback) {
        return db.collection('app_data').doc(key).onSnapshot(snap => {
          if (snap.exists) {
            const data = snap.data().data;
            localStorage.setItem(key, JSON.stringify(data));
            this.setStatus('online', 'オンライン');
            callback(data);
          }
        }, err => {
          console.warn('同期エラー:', err);
          this.setStatus('offline', 'オフライン');
        });
      },

            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (e) {}
      }
    };
