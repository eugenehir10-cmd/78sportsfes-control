<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体育祭トランシーバー貸出</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 max-w-4xl mx-auto p-4 md:p-6">
  <header class="mb-8">
    <h1 class="text-2xl font-bold text-center mb-4">📻 トランシーバー貸出管理</h1>
    <nav class="flex justify-center gap-2 mb-6">
      <button data-tab="lend" class="tab-btn px-4 py-2 rounded-lg bg-blue-500 text-white">貸出</button>
      <button data-tab="return" class="tab-btn px-4 py-2 rounded-lg bg-gray-200">返却</button>
      <button data-tab="list" class="tab-btn px-4 py-2 rounded-lg bg-gray-200">一覧</button>
      <button data-tab="settings" class="tab-btn px-4 py-2 rounded-lg bg-gray-200">設定</button>
    </nav>
  </header>

  <!-- 貸出画面 -->
  <section id="lend" class="tab-content">
    <h2 class="text-xl font-semibold mb-4">貸出登録</h2>
    <form id="lendForm" class="space-y-3 bg-white p-6 rounded-lg shadow">
      <div>
        <label class="block mb-1">機器番号</label>
        <select id="lendId" class="w-full border rounded px-3 py-2" required></select>
      </div>
      <div>
        <label class="block mb-1">利用者名</label>
        <input type="text" id="lendUser" class="w-full border rounded px-3 py-2" required>
      </div>
      <div>
        <label class="block mb-1">配置/行き先</label>
        <input type="text" id="lendPlace" class="w-full border rounded px-3 py-2" required>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">貸出実行</button>
    </form>
  </section>

  <!-- 返却画面 -->
  <section id="return" class="tab-content hidden">
    <h2 class="text-xl font-semibold mb-4">返却登録</h2>
    <form id="returnForm" class="space-y-3 bg-white p-6 rounded-lg shadow">
      <div>
        <label class="block mb-1">機器番号</label>
        <select id="returnId" class="w-full border rounded px-3 py-2" required></select>
      </div>
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">返却実行</button>
    </form>
  </section>

  <!-- 一覧画面 -->
  <section id="list" class="tab-content hidden">
    <h2 class="text-xl font-semibold mb-4">一覧</h2>
    <div class="overflow-x-auto">
      <table class="w-full bg-white rounded-lg shadow">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-2 text-left">番号</th>
            <th class="p-2 text-left">状態</th>
            <th class="p-2 text-left">利用者</th>
            <th class="p-2 text-left">場所</th>
            <th class="p-2 text-left">日時</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </section>

  <!-- 設定画面 -->
  <section id="settings" class="tab-content hidden">
    <h2 class="text-xl font-semibold mb-4">設定</h2>
    <div id="passwordArea">
      <input type="password" id="passwordInput" placeholder="パスワードを入力" class="border rounded px-3 py-2 mb-3">
      <button id="authBtn" class="bg-gray-700 text-white px-4 py-2 rounded">認証</button>
    </div>
    <div id="settingsContent" class="hidden">
      <div class="mb-6 p-4 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2">機器追加</h3>
        <input type="text" id="newId" placeholder="例: TR-001" class="border rounded px-3 py-2 mb-2 w-full">
        <button id="addItem" class="bg-blue-500 text-white px-4 py-2 rounded">追加</button>
      </div>
      <div class="p-4 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2">登録済み機器</h3>
        <ul id="itemList" class="space-y-2"></ul>
      </div>
    </div>
  </section>

  <script>
    const PASSWORD = 'admin123'; // 任意のパスワードに変更可

    // データ操作
    function getItems() {
      return JSON.parse(localStorage.getItem('transceivers') || '[]');
    }
    function saveItems(arr) {
      localStorage.setItem('transceivers', JSON.stringify(arr));
      renderAll();
    }

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('bg-blue-500', 'text-white');
          b.classList.add('bg-gray-200');
        });
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
        btn.classList.remove('bg-gray-200');
        btn.classList.add('bg-blue-500', 'text-white');
      });
    });

    // 貸出プルダウン更新
    function renderLendSelect() {
      const items = getItems().filter(i => i.status !== 'lend');
      const sel = document.getElementById('lendId');
      sel.innerHTML = items.map(i => `<option value="${i.id}">${i.id}</option>`).join('');
    }
    // 返却プルダウン更新
    function renderReturnSelect() {
      const items = getItems().filter(i => i.status === 'lend');
      const sel = document.getElementById('returnId');
      sel.innerHTML = items.map(i => `<option value="${i.id}">${i.id} — ${i.user || ''}</option>`).join('');
    }
    // 一覧描画
    function renderList() {
      const body = document.getElementById('listBody');
      body.innerHTML = getItems().map(i => `
        <tr class="border-t">
          <td class="p-2">${i.id}</td>
          <td class="p-2">
            <span class="px-2 py-0.5 rounded text-sm ${
              i.status === 'ok' ? 'bg-green-100 text-green-700' :
              i.status === 'lend' ? 'bg-red-100 text-red-700' : 'bg-gray-100'
            }">${i.status === 'ok' ? '貸出可' : i.status === 'lend' ? '貸出中' : '返却済'}</span>
          </td>
          <td class="p-2">${i.user || '-'}</td>
          <td class="p-2">${i.place || '-'}</td>
          <td class="p-2 text-sm">${i.time || '-'}</td>
        </tr>
      `).join('');
    }
    // 設定一覧
    function renderSettingsList() {
      const ul = document.getElementById('itemList');
      ul.innerHTML = getItems().map(i => `
        <li class="flex justify-between items-center border-b pb-2">
          <span>${i.id}</span>
          <button data-delete="${i.id}" class="text-red-500 text-sm">削除</button>
        </li>
      `).join('');
    }
    function renderAll() {
      renderLendSelect();
      renderReturnSelect();
      renderList();
      renderSettingsList();
    }

    // 貸出処理
    document.getElementById('lendForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('lendId').value;
      const user = document.getElementById('lendUser').value;
      const place = document.getElementById('lendPlace').value;
      const items = getItems().map(i => {
        if (i.id === id) {
          return { ...i, status: 'lend', user, place, time: new Date().toLocaleString('ja-JP') };
        }
        return i;
      });
      saveItems(items);
      e.target.reset();
      alert('貸出しました');
    });

    // 返却処理
    document.getElementById('returnForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('returnId').value;
      const items = getItems().map(i => {
        if (i.id === id) {
          return { ...i, status: 'return', user: '', place: '', time: new Date().toLocaleString('ja-JP') };
        }
        return i;
      });
      saveItems(items);
      e.target.reset();
      alert('返却されました');
    });

    // パスワード認証
    document.getElementById('authBtn').addEventListener('click', () => {
      if (document.getElementById('passwordInput').value === PASSWORD) {
        document.getElementById('passwordArea').classList.add('hidden');
        document.getElementById('settingsContent').classList.remove('hidden');
      } else {
        alert('パスワードが違います');
      }
    });

    // 機器追加
    document.getElementById('addItem').addEventListener('click', () => {
      const id = document.getElementById('newId').value.trim();
      if (!id) return;
      const items = getItems();
      if (items.some(i => i.id === id)) return alert('既に存在します');
      items.push({ id, status: 'ok', user: '', place: '', time: '' });
      saveItems(items);
      document.getElementById('newId').value = '';
    });

    // 削除
    document.getElementById('itemList').addEventListener('click', e => {
      if (e.target.dataset.delete) {
        if (confirm(`削除しますか？ ${e.target.dataset.delete}`)) {
          saveItems(getItems().filter(i => i.id !== e.target.dataset.delete));
        }
      }
    });

    renderAll();
  </script>
</body>
</html>
