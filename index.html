<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>備品貸出管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .popup { animation: fadeInOut 3s forwards; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(10px); pointer-events: none; }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); pointer-events: none; }
    }
    .category-table { transition: all 0.2s ease; }
    .collapsed tbody { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 max-w-5xl mx-auto p-4 md:p-6">
  <!-- ポップアップ通知 -->
  <div id="popupContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-md px-4 pointer-events-none"></div>

  <header class="mb-8 mt-4">
    <h1 class="text-2xl font-bold text-center mb-4">📻 備品貸出管理システム</h1>
    <nav class="flex flex-wrap justify-center gap-2 mb-6">
      <button data-tab="lend" class="tab-btn px-4 py-2 rounded-lg bg-blue-500 text-white">貸出</button>
      <button data-tab="return" class="tab-btn px-4 py-2 rounded-lg bg-gray-200">返却</button>
      <button data-tab="list" class="tab-btn px-4 py-2 rounded-lg bg-gray-200">一覧</button>
      <button data-tab="settings" class="tab-btn px-4 py-2 rounded-lg bg-gray-200">設定</button>
    </nav>
  </header>

  <!-- 貸出画面 -->
  <section id="lend" class="tab-content">
    <h2 class="text-xl font-semibold mb-4">貸出登録（台数指定）</h2>
    <form id="lendForm" class="space-y-3 bg-white p-6 rounded-lg shadow">
      <div>
        <label class="block mb-1">品目種別</label>
        <select id="lendCategory" class="w-full border rounded px-3 py-2" required>
          <option value="">選択してください</option>
        </select>
      </div>
      <div>
        <label class="block mb-1">利用者名</label>
        <select id="lendUser" class="w-full border rounded px-3 py-2" required>
          <option value="">選択してください</option>
        </select>
      </div>
      <div>
        <label class="block mb-1">必要台数</label>
        <input type="number" id="lendCount" min="1" class="w-full border rounded px-3 py-2" required>
      </div>
      <div>
        <label class="block mb-1">配置/行き先</label>
        <input type="text" id="lendPlace" class="w-full border rounded px-3 py-2" required>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">貸出実行</button>
    </form>
  </section>

  <!-- 返却画面：個別/一括切り替え -->
  <section id="return" class="tab-content hidden">
    <h2 class="text-xl font-semibold mb-4">返却登録</h2>
    
    <!-- 切り替えタブ -->
    <div class="flex gap-2 mb-4">
      <button data-return-mode="single" class="return-tab-btn px-4 py-2 rounded-lg bg-blue-500 text-white">個別返却</button>
      <button data-return-mode="bulk" class="return-tab-btn px-4 py-2 rounded-lg bg-gray-200">一括返却</button>
    </div>

    <!-- 個別返却 -->
    <div id="returnSingle" class="return-mode-content">
      <form id="returnForm" class="space-y-3 bg-white p-6 rounded-lg shadow">
        <div>
          <label class="block mb-1">機器番号</label>
          <select id="returnId" class="w-full border rounded px-3 py-2" required></select>
        </div>
        <div>
          <label class="block mb-1">電池残量</label>
          <select id="returnBattery" class="w-full border rounded px-3 py-2" required>
            <option value="full">🔋 十分</option>
            <option value="medium">🔌 中</option>
            <option value="low">⚠️ 少ない</option>
          </select>
        </div>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">返却実行</button>
      </form>
    </div>

    <!-- 一括返却 -->
    <div id="returnBulk" class="return-mode-content hidden">
      <div class="bg-white p-6 rounded-lg shadow space-y-4">
        <div class="flex justify-between items-center">
          <p class="text-sm text-gray-600">返却する機器を選択してください</p>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" id="selectAllReturn" class="rounded"> 全選択
          </label>
        </div>
        
        <div id="bulkReturnList" class="max-h-80 overflow-y-auto border rounded p-3 space-y-2">
          <p class="text-gray-400 text-center text-sm">貸出中の機器がありません</p>
        </div>

        <div>
          <label class="block mb-1">選択した機器の電池残量</label>
          <select id="bulkBattery" class="w-full border rounded px-3 py-2" required>
            <option value="full">🔋 十分</option>
            <option value="medium">🔌 中</option>
            <option value="low">⚠️ 少ない</option>
          </select>
        </div>
        
        <button id="bulkReturnBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
          一括返却実行
        </button>
      </div>
    </div>
  </section>

  <!-- 一覧画面：品目別に分割 -->
  <section id="list" class="tab-content hidden">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
      <h2 class="text-xl font-semibold">一覧</h2>
      <div class="flex flex-wrap gap-2 text-sm">
        <span id="lastUpdate" class="text-gray-500"></span>
        <button id="exportCsv" class="bg-sky-100 text-sky-700 px-3 py-1 rounded hover:bg-sky-200">📥 CSV出力</button>
      </div>
    </div>

    <!-- 検索・フィルター -->
    <div class="bg-white p-3 rounded-lg shadow mb-4 space-y-2">
      <input type="text" id="searchText" placeholder="🔍 番号・利用者・場所で検索" class="w-full border rounded px-3 py-2">
      <div class="flex gap-2 text-sm">
        <button data-filter="all" class="filter-btn bg-blue-500 text-white px-3 py-1 rounded">全て</button>
        <button data-filter="ok" class="filter-btn bg-gray-200 px-3 py-1 rounded">貸出可</button>
        <button data-filter="lend" class="filter-btn bg-gray-200 px-3 py-1 rounded">貸出中</button>
      </div>
    </div>

    <div id="categoryTables" class="space-y-4"></div>
  </section>

  <!-- 設定画面 -->
  <section id="settings" class="tab-content hidden">
    <h2 class="text-xl font-semibold mb-4">設定</h2>
    <div id="passwordArea">
      <input type="password" id="passwordInput" placeholder="パスワードを入力" class="border rounded px-3 py-2 mb-3">
      <button id="authBtn" class="bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-800 transition">認証</button>
    </div>
    <div id="settingsContent" class="hidden space-y-6">
      <div class="p-4 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2">📦 品目種別管理</h3>
        <div class="flex gap-2 mb-3">
          <input type="text" id="newCategory" placeholder="例: トランシーバー" class="border rounded px-3 py-2 flex-1">
          <button id="addCategory" class="bg-blue-500 text-white px-3 py-2 rounded hover:bg-blue-600">追加</button>
        </div>
        <ul id="categoryList" class="space-y-1 text-sm"></ul>
      </div>

      <div class="p-4 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2">👤 利用者名管理</h3>
        <div class="flex gap-2 mb-3">
          <input type="text" id="newUser" placeholder="例: 1年A組 田中" class="border rounded px-3 py-2 flex-1">
          <button id="addUser" class="bg-blue-500 text-white px-3 py-2 rounded hover:bg-blue-600">追加</button>
        </div>
        <ul id="userList" class="space-y-1 text-sm"></ul>
      </div>

      <div class="p-4 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2">📋 機器一括登録</h3>
        <div class="space-y-2">
          <select id="bulkCategory" class="w-full border rounded px-3 py-2">
            <option value="">種別を選択</option>
          </select>
          <input type="text" id="bulkPrefix" placeholder="例: TR-" class="border rounded px-3 py-2 w-full">
          <div class="flex gap-2">
            <input type="number" id="bulkStart" placeholder="開始番号" min="1" class="border rounded px-3 py-2 flex-1">
            <input type="number" id="bulkEnd" placeholder="終了番号" min="1" class="border rounded px-3 py-2 flex-1">
          </div>
          <button id="bulkAdd" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">一括追加</button>
        </div>
      </div>

      <div class="p-4 bg-white rounded-lg shadow">
        <h3 class="font-medium mb-2">📝 登録済み機器</h3>
        <ul id="itemList" class="space-y-2 text-sm max-h-64 overflow-y-auto"></ul>
      </div>

      <div class="p-4 bg-red-50 rounded-lg border border-red-200">
        <h3 class="font-medium mb-2 text-red-700">⚠️ データ管理</h3>
        <button id="clearAll" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">全データ初期化</button>
      </div>
    </div>
  </section>

  <script>
    const PASSWORD = 'admin123';
    let currentFilter = 'all';
    let searchKeyword = '';
    let collapsedCategories = new Set();

    // === ポップアップ ===
    function showPopup(message, type = 'success') {
      const container = document.getElementById('popupContainer');
      const colors = { success: 'bg-green-500', info: 'bg-blue-500', warning: 'bg-amber-500', error: 'bg-red-500' };
      const popup = Object.assign(document.createElement('div'), {
        className: `popup ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg text-center font-medium mb-2`,
        textContent: message
      });
      container.appendChild(popup);
      setTimeout(() => popup.remove(), 3000);
    }

    // === データ操作 ===
    function getItems() { return JSON.parse(localStorage.getItem('transceivers') || '[]'); }
    function saveItems(arr) { 
      localStorage.setItem('transceivers', JSON.stringify(arr)); 
      localStorage.setItem('lastUpdate', new Date().toLocaleString('ja-JP'));
      renderAll(); 
    }
    function getCategories() { return JSON.parse(localStorage.getItem('categories') || '["トランシーバー"]'); }
    function saveCategories(arr) { localStorage.setItem('categories', JSON.stringify(arr)); renderAll(); }
    function getUsers() { return JSON.parse(localStorage.getItem('users') || '[]'); }
    function saveUsers(arr) { localStorage.setItem('users', JSON.stringify(arr)); renderAll(); }

    // === タブ切り替え（メイン） ===
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('bg-blue-500', 'text-white'); b.classList.add('bg-gray-200');
        });
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
        btn.classList.remove('bg-gray-200'); btn.classList.add('bg-blue-500', 'text-white');
      });
    });

    // === 返却モード切り替え（個別/一括） ===
    document.querySelectorAll('.return-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.return-mode-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.return-tab-btn').forEach(b => {
          b.classList.remove('bg-blue-500', 'text-white'); b.classList.add('bg-gray-200');
        });
        document.getElementById(`return${btn.dataset.returnMode.charAt(0).toUpperCase() + btn.dataset.returnMode.slice(1)}`).classList.remove('hidden');
        btn.classList.remove('bg-gray-200'); btn.classList.add('bg-blue-500', 'text-white');
        if (btn.dataset.returnMode === 'bulk') renderBulkReturnList();
      });
    });

    // === 一括返却リスト描画 ===
    function renderBulkReturnList() {
      const items = getItems().filter(i => i.status === 'lend');
      const container = document.getElementById('bulkReturnList');
      
      if (items.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center text-sm">貸出中の機器がありません</p>';
        return;
      }

      container.innerHTML = items.map(i => `
        <label class="flex items-center gap-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" name="bulkReturnId" value="${i.id}" class="rounded">
          <span class="font-medium">${i.id}</span>
          <span class="text-sm text-gray-500">[${i.category}]</span>
          <span class="text-sm text-gray-600">— ${i.user || '不明'}</span>
          <span class="text-xs text-gray-400 ml-auto">${i.place || '-'}</span>
        </label>
      `).join('');
    }

    // === 全選択/解除 ===
    document.getElementById('selectAllReturn').addEventListener('change', e => {
      document.querySelectorAll('input[name="bulkReturnId"]').forEach(cb => {
        cb.checked = e.target.checked;
      });
    });

    // === フィルター・検索 ===
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-blue-500', 'text-white'); b.classList.add('bg-gray-200');
        });
        btn.classList.remove('bg-gray-200'); btn.classList.add('bg-blue-500', 'text-white');
        renderList();
      });
    });
    document.getElementById('searchText').addEventListener('input', e => {
      searchKeyword = e.target.value.trim();
      renderList();
    });

    // === 一覧描画：品目別テーブル ===
    function renderAll() {
      renderLendSelects();
      renderReturnSelect();
      renderList();
      renderSettings();
    }

    function renderList() {
      const cats = getCategories();
      const items = getItems();
      const batteryLabel = { full: '🔋十分', medium: '🔌中', low: '⚠️少' };
      const batteryBg = { full: 'bg-green-50', medium: 'bg-yellow-50', low: 'bg-red-50' };

      // 更新時刻
      document.getElementById('lastUpdate').textContent = 
        '最終更新: ' + (localStorage.getItem('lastUpdate') || '-');

      // フィルタリング
      let filtered = items.filter(i => {
        const matchFilter = currentFilter === 'all' 
          ? true 
          : (currentFilter === 'ok' && (i.status === 'ok' || i.status === 'return')) ||
            (currentFilter === 'lend' && i.status === 'lend');
        const kw = searchKeyword.toLowerCase();
        const matchSearch = !kw || 
          i.id.toLowerCase().includes(kw) ||
          (i.user && i.user.toLowerCase().includes(kw)) ||
          (i.place && i.place.toLowerCase().includes(kw));
        return matchFilter && matchSearch;
      });

      // 品目ごとにグループ化
      const container = document.getElementById('categoryTables');
      container.innerHTML = '';

      cats.forEach(cat => {
        const catItems = filtered.filter(i => i.category === cat);
        const total = items.filter(i => i.category === cat).length;
        const available = items.filter(i => (i.status === 'ok' || i.status === 'return') && i.category === cat).length;
        const isCollapsed = collapsedCategories.has(cat);

        const tableWrapper = document.createElement('div');
        tableWrapper.className = `category-table bg-white rounded-lg shadow overflow-hidden ${isCollapsed ? 'collapsed' : ''}`;
        tableWrapper.dataset.category = cat;

        tableWrapper.innerHTML = `
          <div class="p-3 bg-gray-50 flex justify-between items-center cursor-pointer" data-toggle="${cat}">
            <h3 class="font-medium">${cat}</h3>
            <span class="text-sm text-gray-500">貸出可 ${available} / 計 ${total} ${isCollapsed ? '▶' : '▼'}</span>
          </div>
          <table class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="p-2 text-left">番号</th>
                <th class="p-2 text-left">状態</th>
                <th class="p-2 text-left">利用者</th>
                <th class="p-2 text-left">場所</th>
                <th class="p-2 text-left">電池</th>
                <th class="p-2 text-left">日時</th>
              </tr>
            </thead>
            <tbody>
              ${catItems.length === 0 ? 
                `<tr><td colspan="6" class="p-3 text-gray-400 text-center">該当なし</td></tr>` :
                catItems.map(i => `
                  <tr class="border-t hover:bg-gray-50">
                    <td class="p-2">${i.id}</td>
                    <td class="p-2">
                      <span class="px-2 py-0.5 rounded text-xs ${
                        i.status === 'lend' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'
                      }">${i.status === 'lend' ? '貸出中' : '貸出可'}</span>
                    </td>
                    <td class="p-2">${i.user || '-'}</td>
                    <td class="p-2">${i.place || '-'}</td>
                    <td class="p-2 ${i.battery ? batteryBg[i.battery] || '' : ''}">${batteryLabel[i.battery] || '-'}</td>
                    <td class="p-2 text-xs">${i.time || '-'}</td>
                  </tr>
                `).join('')
              }
            </tbody>
          </table>
        `;
        container.appendChild(tableWrapper);
      });

      // 折りたたみイベント
      document.querySelectorAll('[data-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.dataset.toggle;
          if (collapsedCategories.has(cat)) collapsedCategories.delete(cat);
          else collapsedCategories.add(cat);
          renderList();
        });
      });
    }

    // === プルダウン描画 ===
    function renderLendSelects() {
      const cats = getCategories();
      const catSel = document.getElementById('lendCategory');
      catSel.innerHTML = '<option value="">選択してください</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('bulkCategory').innerHTML = catSel.innerHTML;

      const users = getUsers();
      const userSel = document.getElementById('lendUser');
      userSel.innerHTML = '<option value="">選択してください</option>' + users.map(u => `<option value="${u}">${u}</option>`).join('');
    }

    function renderReturnSelect() {
      const items = getItems().filter(i => i.status === 'lend');
      const sel = document.getElementById('returnId');
      sel.innerHTML = items.map(i => `<option value="${i.id}">${i.id} [${i.category}] — ${i.user || ''}</option>`).join('');
    }

    function renderSettings() {
      document.getElementById('categoryList').innerHTML = getCategories().map(cat => `
        <li class="flex justify-between items-center border-b pb-1">
          <span>${cat}</span>
          <button data-del-cat="${cat}" class="text-red-500 text-xs">削除</button>
        </li>`).join('');
      document.getElementById('userList').innerHTML = getUsers().map(u => `
        <li class="flex justify-between items-center border-b pb-1">
          <span>${u}</span>
          <button data-del-user="${u}" class="text-red-500 text-xs">削除</button>
        </li>`).join('');
      document.getElementById('itemList').innerHTML = getItems().map(i => `
        <li class="flex justify-between items-center border-b pb-1">
          <span>${i.id} [${i.category}]</span>
          <button data-del-item="${i.id}" class="text-red-500 text-xs">削除</button>
        </li>`).join('');
    }

    // === 貸出処理 ===
    document.getElementById('lendForm').addEventListener('submit', e => {
      e.preventDefault();
      const category = document.getElementById('lendCategory').value;
      const user = document.getElementById('lendUser').value;
      const count = parseInt(document.getElementById('lendCount').value);
      const place = document.getElementById('lendPlace').value;

      if (!category || !user || !count || !place) return;

      const items = getItems();
      const available = items.filter(i => 
        (i.status === 'ok' || i.status === 'return') && i.category === category
      );

      if (available.length < count) {
        showPopup(`在庫不足：利用可能な「${category}」は ${available.length} 台です`, 'warning');
        return;
      }

      const assignIds = available.slice(0, count).map(i => i.id);
      const now = new Date().toLocaleString('ja-JP');
      const updated = items.map(i => {
        if (assignIds.includes(i.id)) return { ...i, status: 'lend', user, place, time: now };
        return i;
      });

      saveItems(updated);
      showPopup(`${assignIds.join(', ')} を貸し出しました`);
      e.target.reset();
    });

    // === 個別返却処理 ===
    document.getElementById('returnForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('returnId').value;
      const battery = document.getElementById('returnBattery').value;

      const items = getItems().map(i => {
        if (i.id === id) return { ...i, status: 'return', battery, time: new Date().toLocaleString('ja-JP') };
        return i;
      });

      saveItems(items);
      e.target.reset();
      showPopup(`${id} を返却しました`);
    });

    // === 一括返却処理 ===
    document.getElementById('bulkReturnBtn').addEventListener('click', () => {
      const selectedCheckboxes = document.querySelectorAll('input[name="bulkReturnId"]:checked');
      if (selectedCheckboxes.length === 0) {
        showPopup('返却する機器を選択してください', 'warning');
        return;
      }

      const selectedIds = Array.from(selectedCheckboxes).map(cb => cb.value);
      const battery = document.getElementById('bulkBattery').value;

      if (!confirm(`${selectedIds.length} 台を一括返却してよろしいですか？\n電池残量：${
        { full: '🔋 十分', medium: '🔌 中', low: '⚠️ 少ない' }[battery]
      }`)) return;

      const items = getItems().map(i => {
        if (selectedIds.includes(i.id)) {
          return { ...i, status: 'return', battery, time: new Date().toLocaleString('ja-JP') };
        }
        return i;
      });

      saveItems(items);
      showPopup(`${selectedIds.length} 台を返却しました：${selectedIds.join(', ')}`);
      renderBulkReturnList();
      document.getElementById('selectAllReturn').checked = false;
    });

    // === CSV出力 ===
    document.getElementById('exportCsv').addEventListener('click', () => {
      const items = getItems();
      if (!items.length) return showPopup('データがありません', 'warning');

      const batteryLabel = { full: '十分', medium: '中', low: '少ない' };
      const statusLabel = { ok: '貸出可', return: '貸出可', lend: '貸出中' };
      const rows = [['番号','種別','状態','利用者','場所','電池残量','日時']];
      items.forEach(i => rows.push([
        i.id, i.category, statusLabel[i.status] || i.status,
        i.user || '-', i.place || '-', batteryLabel[i.battery] || '-', i.time || '-'
      ]));

      const BOM = '\uFEFF';
      const csv = BOM + rows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), {
        href: url, download: `備品一覧_${new Date().toISOString().slice(0,10)}.csv`
      });
      a.click(); URL.revokeObjectURL(url);
      showPopup('CSV出力しました');
    });

    // === 全データ初期化 ===
    document.getElementById('clearAll').addEventListener('click', () => {
      if (!confirm('⚠️ 全てのデータを削除してもよろしいですか？\nこの操作は取り消せません！')) return;
      localStorage.clear();
      showPopup('データを初期化しました', 'info');
      renderAll();
    });

    // === 認証 ===
    document.getElementById('authBtn').addEventListener('click', () => {
      if (document.getElementById('passwordInput').value === PASSWORD) {
        document.getElementById('passwordArea').classList.add('hidden');
        document.getElementById('settingsContent').classList.remove('hidden');
      } else showPopup('パスワードが違います', 'warning');
    });

    // === 品目追加 ===
    document.getElementById('addCategory').addEventListener('click', () => {
      const val = document.getElementById('newCategory').value.trim();
      if (!val) return;
      const cats = getCategories();
      if (!cats.includes(val)) { saveCategories([...cats, val]); showPopup(`「${val}」を追加しました`); }
      else showPopup('既に存在します', 'warning');
      document.getElementById('newCategory').value = '';
    });

    // === 利用者追加 ===
    document.getElementById('addUser').addEventListener('click', () => {
      const val = document.getElementById('newUser').value.trim();
      if (!val) return;
      const users = getUsers();
      if (!users.includes(val)) { saveUsers([...users, val]); showPopup(`「${val}」を追加しました`); }
      else showPopup('既に存在します', 'warning');
      document.getElementById('newUser').value = '';
    });

    // === 一括登録 ===
    document.getElementById('bulkAdd').addEventListener('click', () => {
      const category = document.getElementById('bulkCategory').value;
      const prefix = document.getElementById('bulkPrefix').value.trim();
      const start = parseInt(document.getElementById('bulkStart').value);
      const end = parseInt(document.getElementById('bulkEnd').value);

      if (!category || !prefix || !start || !end || start > end) {
        showPopup('入力内容に不備があります', 'warning'); return;
      }

      const items = getItems();
      const newItems = [];
      for (let n = start; n <= end; n++) {
        const id = prefix + String(n).padStart(3, '0');
        if (!items.some(i => i.id === id)) {
          newItems.push({ id, category, status: 'ok', user: '', place: '', battery: '', time: '' });
        }
      }
      if (newItems.length) {
        saveItems([...items, ...newItems]);
        showPopup(`${newItems.length} 台を追加しました`);
      } else showPopup('新規追加はありません', 'info');
      ['bulkPrefix','bulkStart','bulkEnd'].forEach(id => document.getElementById(id).value = '');
    });

    // === 削除系 ===
    document.getElementById('categoryList').addEventListener('click', e => {
      if (e.target.dataset.delCat && confirm(`削除しますか：${e.target.dataset.delCat}`)) {
        saveCategories(getCategories().filter(c => c !== e.target.dataset.delCat));
        showPopup('削除しました');
      }
    });
    document.getElementById('userList').addEventListener('click', e => {
      if (e.target.dataset.delUser && confirm(`削除しますか：${e.target.dataset.delUser}`)) {
        saveUsers(getUsers().filter(u => u !== e.target.dataset.delUser));
        showPopup('削除しました');
      }
    });
    document.getElementById('itemList').addEventListener('click', e => {
      if (e.target.dataset.delItem && confirm(`削除しますか：${e.target.dataset.delItem}`)) {
        saveItems(getItems().filter(i => i.id !== e.target.dataset.delItem));
        showPopup('削除しました');
      }
    });

    renderAll();
  </script>
</body>
</html>
